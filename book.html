<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attari Books</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .topbar {
      background: #ffffff;
      padding: 14px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      display: inline-block;
      text-decoration: none;
      color: #222;
      font-weight: bold;
      font-size: 16px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .book-box {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.10);
    }

    .book-cover {
      width: 220px;
      max-width: 100%;
      display: block;
      margin: 0 auto 20px;
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(0,0,0,.20);
    }

    .book-title {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin: 10px 0;
      word-break: break-word;
    }

    .book-date {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .option {
      border: none;
      border-radius: 10px;
      padding: 15px 10px;
      background: #f0f0f0;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .option:hover {
      background: #e2e2e2;
    }

    .views {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 50px 10px;
      font-size: 18px;
    }

    .error {
      text-align: center;
      color: #b00020;
      padding: 40px 10px;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      border-radius: 14px;
      padding: 20px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    .modal h2 {
      margin-top: 5px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .submit-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .review-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .review-stars {
      font-size: 18px;
    }

    /* PDF Reader */

    #reader {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 200;
    }

    #pdfFrame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .reader-close {
      position: absolute;
      right: 15px;
      top: 10px;
      z-index: 201;
      border: none;
      background: rgba(0,0,0,.75);
      color: white;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .options {
        grid-template-columns: 1fr;
      }

      .book-title {
        font-size: 21px;
      }

      .container {
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a href="index.html" class="back">← Back to Home</a>
  </div>

  <main class="container">

    <div id="loading" class="loading">
      Book loading...
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="bookBox" class="book-box" style="display:none;">

      <img id="bookCover" class="book-cover" src="" alt="Book cover">

      <div id="bookTitle" class="book-title"></div>

      <div id="bookDate" class="book-date">
        archived
      </div>

      <div class="options">

        <button class="option" onclick="readBook()">
          📖 Read
        </button>

        <button class="option" onclick="downloadBook()">
          📥 Download
        </button>

        <button class="option" onclick="shareBook()">
          🔗 Share Book
        </button>

        <button class="option" onclick="openReview()">
          ⭐ Rate & Review
        </button>

        <button class="option" onclick="openComments()">
          💬 Comments
        </button>

        <button class="option" onclick="showViews()">
          👁️ Views
        </button>

      </div>

      <div class="views">
        👁️ Total Views:
        <strong id="viewCount">0</strong>
      </div>

    </div>
  </main>


  <!-- Review Modal -->

  <div id="reviewModal" class="modal">

    <div class="modal-box">

      <button class="close" onclick="closeModal('reviewModal')">
        ×
      </button>

      <h2>⭐ Rate & Review</h2>

      <select id="rating">
        <option value="5">★★★★★ 5</option>
        <option value="4">★★★★☆ 4</option>
        <option value="3">★★★☆☆ 3</option>
        <option value="2">★★☆☆☆ 2</option>
        <option value="1">★☆☆☆☆ 1</option>
      </select>

      <input
        id="reviewEmail"
        type="email"
        placeholder="Email"
      >

      <textarea
        id="reviewComment"
        placeholder="Write your review..."
      ></textarea>

      <br><br>

      <button class="submit-btn" onclick="submitReview()">
        Submit Review
      </button>

      <div id="reviewMessage"></div>

    </div>
  </div>


  <!-- Comments Modal -->

  <div id="commentsModal" class="modal">

    <div class="modal-box">

      <button class="close" onclick="closeModal('commentsModal')">
        ×
      </button>

      <h2>💬 Comments</h2>

      <div id="commentsList">
        Loading comments...
      </div>

    </div>

  </div>


  <!-- PDF Reader -->

  <div id="reader">

    <button
      class="reader-close"
      onclick="closeReader()"
    >
      ✕ Close
    </button>

    <iframe id="pdfFrame"></iframe>

  </div>


<script>

  /* =========================
     CONFIG
  ========================= */

  const GITHUB_OWNER = "malmd9194-ai";
  const GITHUB_REPO = "Attari_Books";
  const GITHUB_BRANCH = "main";

  const SUPABASE_URL =
    "https://kihhuilyeosvpozduwcs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_-XN0lujfPGCeIzusrlUfkQ_-lFKXwUs";

  const REVIEWS_API =
    "https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     CURRENT BOOK
  ========================= */

  const params =
    new URLSearchParams(window.location.search);

  const bookName =
    params.get("book");


  let currentBook = null;
  let currentPdfUrl = null;


  function removePdfExtension(name) {

    return name
      .replace(/\.pdf$/i, "")
      .replace(/\.PDF$/i, "");

  }


  function showError(message) {

    document.getElementById("loading").style.display = "none";

    const error =
      document.getElementById("error");

    error.style.display = "block";
    error.textContent = message;

  }


  /* =========================
     LOAD BOOK
  ========================= */

  async function loadBook() {

    if (!bookName) {

      showError("Book not found.");

      return;
    }


    try {

      const apiUrl =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

      const response =
        await fetch(apiUrl);

      if (!response.ok) {

        throw new Error(
          "GitHub books list could not be loaded."
        );

      }


      const files =
        await response.json();


      const book =
        files.find(
          file =>
            file.type === "file" &&
            file.name === bookName &&
            /\.pdf$/i.test(file.name)
        );


      if (!book) {

        showError("This book could not be found.");

        return;
      }


      currentBook = book;

      currentPdfUrl =
        `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodeURIComponent(book.name)}`;


      document.getElementById("bookTitle").textContent =
        removePdfExtension(book.name);


      document.getElementById("bookCover").src =
        currentPdfUrl;


      document.getElementById("loading").style.display =
        "none";

      document.getElementById("bookBox").style.display =
        "block";


      await loadArchiveDate();

      await addView();

      await loadViews();

    }

    catch (error) {

      console.error(error);

      showError(
        "Book load karne mein problem hui."
      );

    }

  }


  /* =========================
     ARCHIVED / UPLOAD DATE
  ========================= */

  async function loadArchiveDate() {

    try {

      const url =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?path=${encodeURIComponent(currentBook.name)}&sha=${GITHUB_BRANCH}&per_page=1`;

      const response =
        await fetch(url);

      if (!response.ok) return;

      const commits =
        await response.json();

      if (
        Array.isArray(commits) &&
        commits.length > 0
      ) {

        const date =
          new Date(
            commits[0].commit.author.date
          );

        document.getElementById("bookDate").textContent =
          "archived " +
          date.toLocaleDateString(
            "en-IN",
            {
              day: "2-digit",
              month: "short",
              year: "numeric"
            }
          );

      }

    }

    catch (error) {

      console.log(
        "Archive date unavailable",
        error
      );

    }

  }


  /* =========================
     VIEWS
  ========================= */

  async function addView() {

    if (!currentBook) return;

    try {

      const { data } =
        await supabaseClient
          .from("book_views")
          .select("view_count")
          .eq("book_name", currentBook.name)
          .maybeSingle();


      if (!data) {

        await supabaseClient
          .from("book_views")
          .insert({
            book_name: currentBook.name,
            view_count: 1
          });

      } else {

        await supabaseClient
          .from("book_views")
          .update({
            view_count:
              Number(data.view_count || 0) + 1
          })
          .eq(
            "book_name",
            currentBook.name
          );

      }

    }

    catch (error) {

      console.log(
        "View count error:",
        error
      );

    }

  }


  async function loadViews() {

    if (!currentBook) return;

    try {

      const { data } =
        await supabaseClient
          .from("book_views")
          .select("view_count")
          .eq(
            "book_name",
            currentBook.name
          )
          .maybeSingle();


      document.getElementById("viewCount")
        .textContent =
        data
          ? Number(data.view_count || 0)
          : 0;

    }

    catch (error) {

      console.log(error);

    }

  }


  function showViews() {

    const count =
      document.getElementById("viewCount")
        .textContent;

    alert(
      "👁️ Total Views: " + count
    );

  }


  /* =========================
     READ
  ========================= */

  function readBook() {

    if (!currentPdfUrl) return;

    document.getElementById("pdfFrame").src =
      currentPdfUrl;

    document.getElementById("reader").style.display =
      "block";

  }


  function closeReader() {

    document.getElementById("reader").style.display =
      "none";

    document.getElementById("pdfFrame").src = "";

  }


  /* =========================
     DOWNLOAD
  ========================= */

  function downloadBook() {

    if (!currentPdfUrl) return;

    const link =
      document.createElement("a");

    link.href = currentPdfUrl;
    link.download = currentBook.name;

    document.body.appendChild(link);

    link.click();

    link.remove();

  }


  /* =========================
     SHARE
  ========================= */

  async function shareBook() {

    const shareUrl =
      window.location.href;

    const title =
      removePdfExtension(currentBook.name);


    if (navigator.share) {

      try {

        await navigator.share({

          title:
            "Attari Books - " + title,

          text:
            "Read this book on Attari Books",

          url:
            shareUrl

        });

      }

      catch (error) {

        console.log(
          "Share cancelled"
        );

      }

      return;

    }


    const whatsappUrl =
      "https://wa.me/?text=" +
      encodeURIComponent(
        title +
        "\n\n" +
        shareUrl
      );


    window.open(
      whatsappUrl,
      "_blank"
    );

  }


  /* =========================
     REVIEW
  ========================= */

  function openReview() {

    document.getElementById(
      "reviewModal"
    ).style.display = "block";

  }


  async function submitReview() {

    const rating =
      document.getElementById(
        "rating"
      ).value;

    const comment =
      document.getElementById(
        "reviewComment"
      ).value.trim();

    const email =
      document.getElementById(
        "reviewEmail"
      ).value.trim();


    if (!email) {

      alert(
        "Please enter your email."
      );

      return;

    }


    try {

      const url =
        REVIEWS_API +
        "?book=" +
        encodeURIComponent(
          currentBook.name
        ) +
        "&rating=" +
        encodeURIComponent(rating) +
        "&comment=" +
        encodeURIComponent(comment) +
        "&email=" +
        encodeURIComponent(email);


      await fetch(url, {
        method: "GET",
        mode: "no-cors"
      });


      document.getElementById(
        "reviewMessage"
      ).innerHTML =
        "<p>✅ Review submitted.</p>";


      document.getElementById(
        "reviewComment"
      ).value = "";


    }

    catch (error) {

      console.error(error);

      alert(
        "Review submit nahi ho saka."
      );

    }

  }


  /* =========================
     COMMENTS
  ========================= */

  async function openComments() {

    document.getElementById(
      "commentsModal"
    ).style.display = "block";


    const list =
      document.getElementById(
        "commentsList"
      );


    list.innerHTML =
      "Loading comments...";


    try {

      const response =
        await fetch(
          REVIEWS_API
        );


      const rows =
        await response.json();


      const comments =
        Array.isArray(rows)
          ? rows.filter(
              row =>
                row[0] === currentBook.name &&
                row[2] &&
                String(row[2]).trim()
            )
          : [];


      if (!comments.length) {

        list.innerHTML =
          "<p>No comments yet.</p>";

        return;

      }


      list.innerHTML = "";


      comments.forEach(row => {

        const div =
          document.createElement("div");

        div.className =
          "review-item";


        const rating =
          Number(row[1] || 0);


        const stars =
          "★".repeat(rating) +
          "☆".repeat(
            Math.max(0, 5 - rating)
          );


        div.innerHTML =
          `<div class="review-stars">${stars}</div>
           <div>${escapeHtml(row[2])}</div>
           <small>${escapeHtml(row[3] || "")}</small>`;


        list.appendChild(div);

      });

    }

    catch (error) {

      console.error(error);

      list.innerHTML =
        "<p>Comments load nahi ho sake.</p>";

    }

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text == null
        ? ""
        : String(text);

    return div.innerHTML;

  }


  /* =========================
     MODALS
  ========================= */

  function closeModal(id) {

    document.getElementById(id)
      .style.display = "none";

  }


  window.addEventListener(
    "click",
    function(event) {

      if (
        event.target.classList.contains(
          "modal"
        )
      ) {

        event.target.style.display =
          "none";

      }

    }
  );


  /* =========================
     START
  ========================= */

  loadBook();

</script>

</body>
</html>
