<script>

/* ==================================================
   CONFIG
================================================== */

const SUPABASE_URL =
"https://kihhuilyeosvpozduwcs.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-XN0lujfPGCeIzusrlUfkQ_-lFKXwUs";


const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


const GITHUB_OWNER =
"malmd9194-ai";


const GITHUB_REPO =
"Attari_Books";


const GITHUB_BRANCH =
"main";


/* ==================================================
   VARIABLES
================================================== */

let supabaseClient = null;

let allBooks = [];

let allReviews = [];

let submittedReviews = {};

let selectedReviewRating = 0;

let selectedReviewBook = null;

let authMode = "login";

let readerPresenceChannel = null;

let readerViewerId = null;


/* ==================================================
   PDF.JS
================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* ==================================================
   SUPABASE
================================================== */

function initializeSupabase(){

try{

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

console.log(
"Supabase connected."
);

}catch(error){

console.error(
"Supabase error:",
error
);

}

}


/* ==================================================
   HELPERS
================================================== */

function removePdfExtension(name){

return name.replace(
/\.pdf$/i,
""
);

}


function escapeHTML(text){

const div =
document.createElement("div");

div.textContent =
text;

return div.innerHTML;

}


/* ==================================================
   AUTH ERROR
================================================== */

function getAuthErrorMessage(error){

const msg =
error?.message ||
String(error || "");

if(
/invalid api key/i.test(msg)
){

return
"❌ Supabase API key invalid hai.";

}

if(
/email not confirmed/i.test(msg)
){

return
"❌ Pehle email confirmation karein.";

}

if(
/invalid login credentials/i.test(msg)
){

return
"❌ Email ya password incorrect hai.";

}

return
"❌ " + msg;

}


/* ==================================================
   LOAD REVIEWS
================================================== */

async function loadReviews(){

try{

const response =
await fetch(
GOOGLE_SCRIPT_URL,
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Review loading error"
);

}

const data =
await response.json();

allReviews =
Array.isArray(data)
? data
: [];

return allReviews;

}catch(error){

console.error(
error
);

allReviews = [];

return [];

}

}


/* ==================================================
   LOAD USER REVIEWS
================================================== */

async function loadSubmittedReviews(email){

await loadReviews();

submittedReviews = {};

const key =
String(email || "")
.toLowerCase()
.trim();

allReviews.forEach(row=>{

const book =
String(row[0] || "")
.trim();

const rowEmail =
String(row[4] || "")
.toLowerCase()
.trim();

if(
book &&
rowEmail &&
rowEmail === key
){

if(
!submittedReviews[key]
){

submittedReviews[key] = {};

}

submittedReviews[key][book] =
true;

}

});

await refreshVisibleReviewButtons();

}


/* ==================================================
   REVIEW BUTTONS
================================================== */

async function refreshVisibleReviewButtons(){

if(!supabaseClient){
return;
}

const {
data
} =
await supabaseClient.auth.getSession();

const email =
data?.session?.user?.email
?.toLowerCase()
.trim();

const buttons =
document.querySelectorAll(
".rate-review-btn,.reviewed-btn"
);

buttons.forEach(button=>{

const card =
button.closest(".book-card");

if(!card){
return;
}

const bookIndex =
Number(card.dataset.bookIndex);

const book =
allBooks[bookIndex];

if(!book){
return;
}

if(
email &&
submittedReviews[email] &&
submittedReviews[email][book.name]
){

button.className =
"reviewed-btn";

button.innerText =
"✅ Already Reviewed";

button.disabled =
true;

button.onclick =
null;

}else{

button.className =
"rate-review-btn";

button.innerText =
"⭐ Rate & Review";

button.disabled =
false;

button.onclick =
()=>{
openReviewForBook(bookIndex);
};

}

});

}


/* ==================================================
   LOAD BOOKS
================================================== */

async function loadBooks(){

const status =
document.getElementById(
"status"
);

const grid =
document.getElementById(
"booksGrid"
);

status.innerHTML =
"📚 Loading books...";

grid.innerHTML = "";

try{

const apiUrl =
`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;


const response =
await fetch(apiUrl);

if(!response.ok){

throw new Error(
"GitHub API Error: "+
response.status
);

}

const files =
await response.json();


const pdfFiles =
files.filter(
file=>
file.type === "file" &&
file.name
.toLowerCase()
.endsWith(".pdf")
);


allBooks =
pdfFiles.map(
file=>({

name:file.name,

download_url:
file.download_url,

html_url:
file.html_url

})
);


if(!allBooks.length){

status.innerHTML =
"📚 No PDF books found.";

displayBooks([]);

return;

}


status.innerHTML =
`${allBooks.length} book(s) available`;

displayBooks(
allBooks
);


}catch(error){

console.error(error);

status.innerHTML =
"❌ Books load nahi ho pa rahe.";

grid.innerHTML = `

<div
style="
grid-column:1/-1;
text-align:center;
padding:30px;
color:#777;">

<p>
GitHub se books load nahi ho pa rahi hain.
</p>

<p
style="
font-size:13px;
margin-top:10px;">

Please page refresh karke dobara try karein.

</p>

</div>

`;

}

}


/* ==================================================
   DISPLAY BOOKS
================================================== */

function displayBooks(books){

const grid =
document.getElementById(
"booksGrid"
);

grid.innerHTML = "";

if(!books.length){

grid.innerHTML = `

<div
style="
grid-column:1/-1;
text-align:center;
padding:30px;">

📚 No books found.

</div>

`;

return;

}


books.forEach(
(book,index)=>{

const originalIndex =
allBooks.indexOf(book);


const card =
document.createElement(
"div"
);

card.className =
"book-card";

card.dataset.bookIndex =
originalIndex;


card.innerHTML = `

<div
class="cover-box"
id="cover-${index}">

<div class="cover-loading">

📖 Loading cover...

</div>

</div>


<div class="book-info">


<div
class="book-title"
title="Open book">

${escapeHTML(
removePdfExtension(book.name)
)}

</div>


<div class="book-buttons">


<button
class="read-btn"
onclick="openReader(${originalIndex})">

📖 Read

</button>


<a
class="download-btn"
href="${book.download_url}"
download>

async function shareBook(bookIndex){

const book =
allBooks[bookIndex];

if(!book){
return;
}

const title =
removePdfExtension(
book.name
);

const url =
book.download_url;


if(navigator.share){

try{

await navigator.share({

title:
"Attari Books - "+title,

text:
"📚 "+title,

url:url

});

}catch(error){

if(
error?.name === "AbortError"
){

return;

}

}

}


const whatsappUrl =
"https://wa.me/?text="+
encodeURIComponent(
"📚 "+title+
"\n"+
url
);

window.open(
whatsappUrl,
"_blank"
);

}


/* ==================================================
   COMMENTS
================================================== */

async function showCommentsForBook(bookIndex){

const book =
allBooks[bookIndex];

if(!book){
return;
}


document.getElementById(
"commentsBookName"
).innerText =
removePdfExtension(
book.name
);


document.getElementById(
"commentsList"
).innerHTML =
"⏳ Loading comments...";


document.getElementById(
"commentsModal"
).style.display =
"flex";


const reviews =
await loadReviews();


const rows =
reviews.filter(
row=>
String(row[0] || "")
.trim() ===
String(book.name)
.trim()
);


const list =
document.getElementById(
"commentsList"
);


if(!rows.length){

list.innerHTML = `

<div
style="
text-align:center;
color:#777;
padding:20px;">

💬 Is book par abhi koi
comment/review nahi hai.

</div>

`;

return;

}


list.innerHTML =
rows
.slice()
.reverse()
.map(row=>{

const rating =
Math.max(
0,
Math.min(
5,
Number(row[1]) || 0
)
);

const comment =
escapeHTML(
String(row[2] || "")
.trim()
);

let date = "";

if(row[3]){

try{

date =
new Date(
row[3]
).toLocaleDateString();

}catch(e){}

}


return `

<div class="comment-item">

<div class="comment-rating">

${"★".repeat(rating)}
${"☆".repeat(5-rating)}

</div>


${
comment
?
`<div class="comment-text">
${comment}
</div>`
:
""
}


${
date
?
`<div class="comment-date">
${escapeHTML(date)}
</div>`
:
""
}

</div>

`;

})
.join("");

}

/* ==================================================
   VIEWER ID
================================================== */

function getReaderViewerId(){

try{

readerViewerId =
localStorage.getItem(
"attari_books_viewer_id"
);


if(!readerViewerId){

readerViewerId =
crypto.randomUUID
? crypto.randomUUID()
: "viewer-"+Date.now()+"-"+Math.random();


localStorage.setItem(
"attari_books_viewer_id",
readerViewerId
);

}


}catch(error){

readerViewerId =
"viewer-"+Date.now()+"-"+Math.random();

}


return readerViewerId;

}


/* ==================================================
   VIEWER CHANNEL
================================================== */

function makeViewerChannelName(bookName){

let hash = 0;


for(
let i=0;
i<bookName.length;
i++
){

hash =
(
(hash << 5)
-
hash +
bookName.charCodeAt(i)
)
|0;

}


return
"attari-book-viewers-"+
Math.abs(hash);

}

   VIEWER COUNT

/* ==================================================
   START PRESENCE
================================================== */

async function startReaderPresence(book){

if(
!book ||
!supabaseClient
){

return;

}


await stopReaderPresence();


const viewerId =
getReaderViewerId();


const channelName =
makeViewerChannelName(
book.name
);


readerPresenceChannel =
supabaseClient.channel(
channelName,
{

config:{

presence:{

key:
viewerId

}

}

}
);


readerPresenceChannel.on(
"presence",
{
event:"sync"
},
()=>{

if(!readerPresenceChannel){
return;
}


const state =
readerPresenceChannel
.presenceState();


setReaderViewerCount(
Object.keys(state).length
);

}
);


readerPresenceChannel.subscribe(
async status=>{

if(
status === "SUBSCRIBED"
){

const {
error
} =
await readerPresenceChannel.track({

viewer_id:
viewerId,

book:
book.name,

online_at:
new Date().toISOString()

});


if(error){

console.error(
"Viewer tracking error:",
error
);

setReaderViewerCount(1);

}

}

}
);

}


/* ==================================================
   STOP PRESENCE
================================================== */

async function stopReaderPresence(){

if(
!readerPresenceChannel
){

setReaderViewerCount(0);

return;

}


try{

await readerPresenceChannel.untrack();

}catch(error){

console.error(error);

}


try{

await supabaseClient
.removeChannel(
readerPresenceChannel
);

}catch(error){

console.error(error);

}


readerPresenceChannel =
null;

setReaderViewerCount(0);

}

async function openReader(bookIndex){

const book =
allBooks[bookIndex];


if(!book){

}


const reader =
document.getElementById(

);


const title =
document.getElementById(

);

document.getElementById(

);


const pages =
document.getElementById(
"readerPages"
);


reader.style.display =
"flex";


title.textContent =
removePdfExtension(
book.name
);


pages.innerHTML =
"";


loading.style.display =
"block";


loading.textContent =
"📖 Loading PDF...";


/*
Start live viewer count
*/

startReaderPresence(book);


try{


const pdf =
await pdfjsLib
.getDocument({

url:
book.download_url,

withCredentials:false

})
.promise;


loading.textContent =
`📖 Loading ${pdf.numPages} pages...`;

Render EVERY page vertically
*/

for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

pdf,
pageNumber
);

}


loading.style.display =
"none";


}catch(error){

console.error(
"Reader error:",
error
);


loading.textContent =
"❌ PDF open nahi ho saki.";

}

}


/* ==================================================
   RENDER FULL PDF PAGE
================================================== */

async function renderFullReaderPage(
pdf,
pageNumber
){

try{


const page =
await pdf.getPage(
pageNumber
);


const container =
document.getElementById(
"readerContent"
);


const pages =
document.getElementById(
"readerPages"
);


const baseViewport =
page.getViewport({

scale:1

});


const availableWidth =
container.clientWidth -
30;


let scale =
availableWidth /
baseViewport.width;


/*
Readable but not excessively huge
*/

scale =
Math.min(
scale,
2
);


scale =
Math.max(
scale,
0.7
);


const viewport =
page.getViewport({

scale:
scale

});


const canvas =
document.createElement(
"canvas"
);


canvas.className =
"reader-page";


canvas.width =
viewport.width;


canvas.height =
viewport.height;


const context =
canvas.getContext(
"2d"
);


pages.appendChild(
canvas
);


await page.render({

canvasContext:
context,

viewport:
viewport

}).promise;


}catch(error){

console.error(
"Page render error:",
error
);

}

}
