<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attari Books</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      padding: 8px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 60px 20px 45px;
    }

    .hero h1 {
      font-size: 44px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #777;
      font-size: 22px;
    }

    .search-area {
      padding: 35px 20px;
      text-align: center;
    }

    #searchBox {
      width: 90%;
      max-width: 940px;
      padding: 18px 22px;
      border: 1px solid #ccc;
      border-radius: 16px;
      font-size: 20px;
      outline: none;
      background: white;
    }

    #searchBox:focus {
      border-color: #777;
    }

    .book-section {
      padding: 25px;
      min-height: 300px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .book {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .cover {
      width: 100%;
      height: 330px;
      background: #eeeeee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .cover canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
    }

    .cover-loading {
      color: #777;
      text-align: center;
      font-size: 18px;
      padding: 20px;
    }

    .book h3 {
      font-size: 21px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .author {
      color: #777;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 13px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
    }

    .read {
      background: #2563eb;
      color: white;
    }

    .download {
      background: #16a34a;
      color: white;
    }

    .star {
      background: #f59e0b;
      color: white;
    }

    .comment {
      background: #7c3aed;
      color: white;
    }

    .share {
      background: #0891b2;
      color: white;
    }

    .actions {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 5px;
    }

    .comment-box {
      display: none;
      margin-top: 10px;
    }

    .comment-box textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .comment-box button {
      margin-top: 7px;
      padding: 9px 14px;
      border: none;
      border-radius: 7px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .saved-comment {
      margin-top: 10px;
      padding: 10px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 14px;
      color: #444;
      display: none;
      word-break: break-word;
    }

    .message {
      background: white;
      border-radius: 14px;
      padding: 50px 20px;
      text-align: center;
      color: #777;
      font-size: 20px;
      width: 100%;
    }

    .error-box {
      color: #b91c1c;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
      margin-top: 30px;
      font-size: 16px;
    }

    /* PDF Reader */

    #reader {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 99999;
      overflow-y: auto;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #1f2937;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .reader-header h2 {
      font-size: 20px;
      word-break: break-word;
    }

    .close-reader {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      flex-shrink: 0;
    }

    #pdfPages {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #pdfPages canvas {
      max-width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 3px 15px rgba(0,0,0,0.4);
    }

    @media (max-width: 600px) {

      header {
        padding: 16px;
      }

      .logo {
        font-size: 23px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 15px;
      }

      .hero {
        padding: 40px 15px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 18px;
      }

      .book-section {
        padding: 15px;
      }

      .cover {
        height: 360px;
      }

      .reader-header h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="logo">📚 Attari Books</div>

    <nav>
      <a href="#">Home</a>
      <a href="#books">Books</a>
      <a href="mailto:mdmalek26234@gmail.com">✉️ Email</a>
      <a href="https://wa.me/919534646778" target="_blank">💬 WhatsApp</a>
    </nav>
  </header>


  <!-- HERO -->

  <section class="hero">
    <h1>📚 Attari Books</h1>
    <p>Read and download your favourite books</p>
  </section>


  <!-- SEARCH -->

  <section class="search-area">
    <input
      type="text"
      id="searchBox"
      placeholder="🔎 Search books..."
      oninput="searchBooks()"
    >
  </section>


  <!-- BOOKS -->

  <section class="book-section" id="books">

    <div class="book-grid" id="bookList">

      <div class="message">
        📚 Loading books...

    </div>

  </section>

  <div id="reader">

    <div class="reader-header">

      <h2 id="readerTitle">

      </h2>

      <button
        class="close-reader"
        onclick="closeReader()"
      >
        ✕ Close
      </button>

    </div>

    <div id="pdfPages"></div>

  </div>


  <!-- FOOTER -->

  <footer>
    © 2026 Attari Books — All Rights Reserved
  </footer>


<script>

  /* ==========================================
     GITHUB SETTINGS
  ========================================== */

  const GITHUB_OWNER = "malmd9194-ai";
  const GITHUB_REPO = "Attari_Books";
  const GITHUB_BRANCH = "main";


  /* ==========================================
     PDF.JS
  ========================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ==========================================
     GITHUB API URL
  ========================================== */

  const API_URL =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;


  /* ==========================================
     LOAD BOOKS
  ========================================== */

  async function loadBooks() {

    const bookList =
      document.getElementById("bookList");

    bookList.innerHTML = `
      <div class="message">
        📚 Loading books...
      </div>
    `;

    try {

      const controller =
        new AbortController();

      const timeout =
        setTimeout(() => controller.abort(), 15000);


      const response =
        await fetch(API_URL, {
          method: "GET",
          headers: {
            "Accept": "application/vnd.github+json"
          },
          cache: "no-store",
          signal: controller.signal
        });


      clearTimeout(timeout);


      if (!response.ok) {

        if (response.status === 403) {

          throw new Error(
            "GitHub API limit reached. Please try again later."
          );

        }

        if (response.status === 404) {

          throw new Error(
            "GitHub repository/branch not found. Please check repository settings."
          );

        }

        throw new Error(
          "GitHub API Error: " + response.status
        );
      }


      const data =
        await response.json();


      if (!data.tree) {

        throw new Error(
          "GitHub did not return the file list."
        );
      }


      /* Find every PDF anywhere in repository */

      const pdfFiles =
        data.tree.filter(item => {

          return (
            item.type === "blob" &&
            item.path.toLowerCase().endsWith(".pdf")
          );

        });


      bookList.innerHTML = "";


      if (pdfFiles.length === 0) {

        bookList.innerHTML = `
          <div class="message">
            📚 No PDF books found.
            <br><br>
            Please upload PDF files to your
            <b>Attari_Books</b> repository.
          </div>
        `;

        return;
      }


      /* Sort alphabetically */

      pdfFiles.sort((a, b) =>
        a.path.localeCompare(
          b.path,
          undefined,
          { sensitivity: "base" }
        )
      );


      /* Create every book */

      pdfFiles.forEach(file => {

        const pathParts =
          file.path.split("/");

        const fileName =
          pathParts[pathParts.length - 1];


        const bookName =
          fileName
            .replace(/\.pdf$/i, "")
            .replace(/[_-]/g, " ")
            .trim();


        /*
          Raw GitHub URL
          encode every path part separately
        */

        const encodedPath =
          file.path
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");


        const pdfUrl =
          `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodedPath}`;


        const book =
          document.createElement("div");

        book.className = "book";


        book.innerHTML = `

          <div class="cover">

            <div class="cover-loading">

              📖
              <br>
              Loading cover...

            </div>

          </div>


          <h3>
            ${escapeHTML(bookName)}
          </h3>


          <p class="author">
            Attari Books
          </p>


          <!-- READ + DOWNLOAD -->

          <div class="buttons">

            <button
              class="btn read"
              onclick="openReader(
                '${escapeJS(pdfUrl)}',
                '${escapeJS(bookName)}'
              )"
            >
              📖 Read
            </button>


            <a
              href="${pdfUrl}"
              class="btn download"
              target="_blank"
              rel="noopener"
              download
            >
              ⬇ Download
            </a>

          </div>


          <!-- STAR COMMENT SHARE -->

          <div class="buttons actions">

            <button
              class="btn star"
              onclick="toggleStar(this)"
            >
              ☆ Star
            </button>


            <button
              class="btn comment"
              onclick="toggleComment(this)"
            >
              💬 Comment
            </button>


            <button
              class="btn share"
              onclick="shareBook(
                '${escapeJS(pdfUrl)}',
                '${escapeJS(bookName)}'
              )"
            >
              🔗 Share
            </button>

          </div>


          <!-- COMMENT BOX -->

          <div class="comment-box">

            <textarea
              placeholder="Write your comment..."
            ></textarea>

            <button
              onclick="saveComment(this)"
            >
              Save Comment
            </button>

          </div>


          <div class="saved-comment"></div>

        `;


        bookList.appendChild(book);


        /* Load first page as cover */

        const cover =
          book.querySelector(".cover");


        loadCover(
          pdfUrl,
          cover
        );

      });


    } catch (error) {

      console.error(
        "BOOK LOADING ERROR:",
        error
      );


      let message =
        error.message;


      if (
        error.name === "AbortError"
      ) {

        message =
          "GitHub request timed out. Please try again.";

      }


      bookList.innerHTML = `

        <div class="message error-box">

          ⚠️ Books load nahi ho pa rahe.

          <br><br>

          <b>${escapeHTML(message)}</b>

          <br><br>

          <button
            class="retry-btn"
            onclick="loadBooks()"
          >
            🔄 Try Again
          </button>

        </div>

      `;

    }

  }


  /* ==========================================
     PDF COVER
  ========================================== */

  async function loadCover(
    pdfUrl,
    cover
  ) {

    try {

      const pdf =
        await pdfjsLib
          .getDocument({
            url: pdfUrl
          })
          .promise;


      const page =
        await pdf.getPage(1);


      const containerWidth =
        cover.clientWidth || 250;


      const baseViewport =
        page.getViewport({
          scale: 1
        });


      const scale =
        containerWidth /
        baseViewport.width;


      const viewport =
        page.getViewport({
          scale: Math.min(scale, 1.5)
        });


      const canvas =
        document.createElement("canvas");


      const context =
        canvas.getContext("2d");


      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;


      cover.innerHTML = "";

      cover.appendChild(canvas);


      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


    } catch (error) {

      console.error(
        "Cover error:",
        error
      );


      cover.innerHTML = `

        <div class="cover-loading">

          📖
          <br>
          Cover unavailable

        </div>

      `;

    }

  }


  /* ==========================================
     PDF READER
  ========================================== */

  async function openReader(
    pdfUrl,
    title
  ) {

    const reader =
      document.getElementById("reader");

    const readerTitle =
      document.getElementById("readerTitle");

    const pdfPages =
      document.getElementById("pdfPages");


    reader.style.display =
      "block";


    document.body.style.overflow =
      "hidden";


    readerTitle.textContent =
      title;


    pdfPages.innerHTML = `

      <div style="
        color:white;
        padding:30px;
        text-align:center;
        font-size:20px;
      ">

        📖 Book loading...

      </div>

    `;


    try {

      const pdf =
        await pdfjsLib
          .getDocument({
            url: pdfUrl
          })
          .promise;


      pdfPages.innerHTML = "";


      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        const page =
          await pdf.getPage(pageNumber);


        const viewport =
          page.getViewport({
            scale: 1.3
          });


        const canvas =
          document.createElement("canvas");


        const context =
          canvas.getContext("2d");


        canvas.width =
          viewport.width;


        canvas.height =
          viewport.height;


        pdfPages.appendChild(
          canvas
        );


        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

      }


    } catch (error) {

      console.error(
        "Reader error:",
        error
      );


      pdfPages.innerHTML = `

        <div style="
          color:white;
          text-align:center;
          padding:40px;
          font-size:18px;
        ">

          ⚠️ PDF open nahi ho pa rahi.

          <br><br>

          Please internet connection
          check karein.

        </div>

      `;

    }

  }


  /* ==========================================
     CLOSE READER
  ========================================== */

  function closeReader() {

    document.getElementById(
      "reader"
    ).style.display = "none";


    document.body.style.overflow =
      "";


    document.getElementById(
      "pdfPages"
    ).innerHTML = "";

  }


  /* ==========================================
     SEARCH
  ========================================== */

  function searchBooks() {

    const search =
      document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();


    const books =
      document.querySelectorAll(
        ".book"
      );


    books.forEach(book => {

      const title =
        book.innerText.toLowerCase();


      book.style.display =
        title.includes(search)
          ? ""
          : "none";

    });

  }


  /* ==========================================
     STAR
  ========================================== */

  function toggleStar(button) {

    if (
      button.dataset.starred === "yes"
    ) {

      button.dataset.starred =
        "no";

      button.textContent =
        "☆ Star";

    } else {

      button.dataset.starred =
        "yes";

      button.textContent =
        "⭐ Starred";

    }

  }


  /* ==========================================
     COMMENT OPEN/CLOSE
  ========================================== */

  function toggleComment(button) {

    const book =
      button.closest(".book");


    const box =
      book.querySelector(
        ".comment-box"
      );


    if (
      box.style.display === "block"
    ) {

      box.style.display =
        "none";

    } else {

      box.style.display =
        "block";

    }

  }


  /* ==========================================
     SAVE COMMENT
  ========================================== */

  function saveComment(button) {

    const box =
      button.closest(".comment-box");


    const book =
      button.closest(".book");


    const textarea =
      box.querySelector(
        "textarea"
      );


    const saved =
      book.querySelector(
        ".saved-comment"
      );


    const text =
      textarea.value.trim();


    if (!text) {

      alert(
        "Please write a comment first."
      );

      return;

    }


    saved.textContent =
      "💬 " + text;


    saved.style.display =
      "block";


    textarea.value = "";

  }


  /* ==========================================
     SHARE
  ========================================== */

  async function shareBook(
    pdfUrl,
    bookName
  ) {

    const shareData = {

      title:
        bookName + " - Attari Books",

      text:
        "Read
