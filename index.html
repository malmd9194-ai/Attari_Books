<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attari Books</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    /* HEADER */
    header {
      background: #111;
      color: white;
      padding: 15px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a,
    nav button {
      color: white;
      text-decoration: none;
      border: none;
      background: transparent;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 15px;
      border-radius: 7px;
    }

    nav a:hover {
      background: #333;
    }

    .auth-btn {
      background: white !important;
      color: #222 !important;
    }

    .logout-btn {
      background: #d9534f !important;
      color: white !important;
    }

    /* HERO */
    .hero {
      min-height: 380px;
      padding: 80px 20px;
      text-align: center;
      background:
        linear-gradient(rgba(20,20,20,.78), rgba(20,20,20,.78)),
        url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    #searchBox {
      width: min(680px, 90%);
      padding: 17px 20px;
      border-radius: 35px;
      border: none;
      outline: none;
      font-size: 17px;
    }

    /* BOOKS */
    .books-section {
      padding: 50px 6%;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 35px;
    }

    #status {
      text-align: center;
      color: #666;
      margin: 20px;
      font-size: 16px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 25px;
    }

    .book-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.10);
      transition: .2s;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 7px 20px rgba(0,0,0,.15);
    }

    .cover-box {
      width: 100%;
      height: 290px;
      background: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover-box canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .cover-loading {
      color: #777;
      font-size: 14px;
    }

    .book-info {
      padding: 17px;
    }

    .book-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      word-break: break-word;
      line-height: 1.4;
    }

    .book-buttons {
      display: flex;
      gap: 8px;
    }

    .book-buttons a,
    .book-buttons button {
      flex: 1;
      padding: 10px 7px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
    }

    .read-btn {
      background: #222;
      color: white;
    }

    .download-btn {
      background: #198754;
      color: white;
    }

    /* HELP */
    .help-menu {
      display: none;
      position: absolute;
      right: 20px;
      top: 65px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
      padding: 10px;
      z-index: 100;
      min-width: 190px;
    }

    .help-menu a {
      display: block;
      color: #222;
      padding: 10px;
      text-decoration: none;
      border-radius: 6px;
    }

    .help-menu a:hover {
      background: #eee;
    }

    .help-wrapper {
      position: relative;
    }

    /* AUTH MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: min(420px, 100%);
      background: white;
      border-radius: 15px;
      padding: 25px;
      position: relative;
    }

    .modal-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 10px;
      border: none;
      background: none;
      font-size: 27px;
      cursor: pointer;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 18px;
    }

    .auth-tabs button {
      flex: 1;
      padding: 11px;
      border: none;
      cursor: pointer;
      background: #eee;
    }

    .auth-tabs button.active {
      background: #222;
      color: white;
    }

    .auth-input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .auth-submit {
      width: 100%;
      padding: 13px;
      border: none;
      background: #222;
      color: white;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    #authMessage {
      margin-top: 13px;
      text-align: center;
      font-size: 14px;
    }

    /* REVIEW */
    .review-section {
      margin-top: 50px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .review-section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .review-note {
      text-align: center;
      color: #777;
      margin-bottom: 15px;
    }

    .review-select,
    .review-textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .review-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
    }

    .star {
      font-size: 32px;
      border: none;
      background: none;
      cursor: pointer;
      color: #bbb;
    }

    .star.selected {
      color: #f5b301;
    }

    .submit-review {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #198754;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .login-review-message {
      text-align: center;
      padding: 20px;
      background: #f1f3f5;
      border-radius: 8px;
    }

    /* FOOTER */
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 17px;
      }

      header {
        justify-content: center;
      }

      .logo {
        width: 100%;
        text-align: center;
      }

      nav {
        justify-content: center;
      }

      .books-section {
        padding: 35px 5%;
      }

      .cover-box {
        height: 260px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      📚 Attari Books
    </div>

    <nav>
      <a href="#">Home</a>

      <a href="#books">
        Books
      </a>

      <div class="help-wrapper">
        <button onclick="toggleHelp()">
          Help
        </button>

        <div class="help-menu" id="helpMenu">
          <a href="https://wa.me/919534646778" target="_blank">
            💬 WhatsApp
          </a>

          <a href="mailto:mdmalek26234@gmail.com">
            ✉️ Gmail / Email
          </a>
        </div>
      </div>

      <button
        class="auth-btn"
        id="loginBtn"
        onclick="openAuth('login')">
        🔐 Login

      <button
        class="auth-btn"

  </header>


  <!-- HERO -->
  <section class="hero">

    <h1>

      Your Digital Library
    </p>

    <input
      type="text"
      id="searchBox"

  </section>


  <!-- BOOKS -->
  <section class="books-section" id="books">

    <h2 class="section-title">
      Latest Books
    </h2>

    <div id="status">
      📚 Loading books...
    </div>

    <div
      class="books-grid"
      id="booksGrid">
    </div>

  </section>


  <!-- REVIEWS -->
  <section class="review-section">

    <h2>
      ⭐ Rate & Review a Book
    </h2>

    <div id="reviewBox">
      <div class="login-review-message">
        🔐 Please login to rate and review a book.
        <br><br>

        <button
          onclick="openAuth('login')"
          style="
            padding:10px 18px;
            border:none;
            border-radius:7px;
            background:#222;
            color:white;
            cursor:pointer;">
          Login
        </button>
      </div>
    </div>

  </section>


  <!-- AUTH MODAL -->
  <div
    class="modal"
    id="authModal">

    <div class="modal-box">

      <button
        class="close-btn"
        onclick="closeAuth()">
        ×
      </button>

      <h2 id="authTitle">
        Login
      </h2>

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="active"
          onclick="switchAuth('login')">
          Login
        </button>

        <button
          id="signupTab"
          onclick="switchAuth('signup')">
          Sign Up
        </button>

      </div>

      <form onsubmit="handleAuth(event)">

        <input
          type="email"
          id="authEmail"
          class="auth-input"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="authPassword"
          class="auth-input"
          placeholder="Password"
          minlength="6"
          required
        >

        <button
          type="submit"
          class="auth-submit"
          id="authSubmit">
          Login
        </button>

      </form>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- FOOTER -->
  <footer>
    <p>
      © 2026 Attari Books — Your Digital Library
    </p>
  </footer>


<script>

  /* =====================================================
     SUPABASE SETTINGS
     ===================================================== */

  const SUPABASE_URL =
    "https://kihhuilyeosvpozduwcs.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_-XN0lujfPGCeIzusrlUfkQ_-lFKXw";


  /* =====================================================
     GOOGLE SHEETS SETTINGS
     ===================================================== */

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


  /* =====================================================
     GITHUB SETTINGS
     ===================================================== */

  const GITHUB_OWNER =
    "malmd9194-ai";

  const GITHUB_REPO =
    "Attari_Books";

  const GITHUB_BRANCH =
    "main";


  /* =====================================================
     VARIABLES
     ===================================================== */

  let supabaseClient = null;

  let allBooks = [];

  let selectedRating = 0;

  let authMode = "login";


  /* =====================================================
     PDF.JS
     ===================================================== */

  if (typeof pdfjsLib !== "undefined") {

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  }


  /* =====================================================
     SAFE SUPABASE INITIALIZATION
     ===================================================== */

  function initializeSupabase() {

    try {

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ) {

        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );

        console.log("Supabase connected.");

      } else {

        console.error(
          "Supabase library load nahi hui."
        );

      }

    } catch (error) {

      console.error(
        "Supabase initialization error:",
        error
      );

    }

  }


  /* =====================================================
     LOAD BOOKS FROM GITHUB
     ===================================================== */

  async function loadBooks() {

    const status =
      document.getElementById("status");

    const grid =
      document.getElementById("booksGrid");

    status.innerHTML =
      "📚 Loading books...";

    grid.innerHTML = "";

    try {

      const apiUrl =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

      const response =
        await fetch(apiUrl);

      if (!response.ok) {

        throw new Error(
          "GitHub API Error: " +
          response.status
        );

      }

      const files =
        await response.json();

      console.log(
        "GitHub files:",
        files
      );


      /* Only PDF files */

      const pdfFiles =
        files.filter(file => {

          return (
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".pdf")
          );

        });


      if (pdfFiles.length === 0) {

        status.innerHTML =
          "📚 No PDF books found.";

        return;

      }


      allBooks =
        pdfFiles.map(file => {

          return {

            name: file.name,

            download_url:
              file.download_url,

            html_url:
              file.html_url

          };

        });


      status.innerHTML =
        `${allBooks.length} book(s) available`;

      displayBooks(allBooks);

    } catch (error) {

      console.error(
        "Books loading error:",
        error
      );

      status.innerHTML =
        "❌ Books load nahi ho pa rahe.";

      grid.innerHTML = `
        <div style="
          grid-column:1/-1;
          text-align:center;
          padding:30px;
          color:#777;">
          <p>GitHub se books load nahi ho pa rahi hain.</p>
          <p style="font-size:13px;margin-top:10px;">
            Please page refresh karke dobara try karein.
          </p>
        </div>
      `;

    }

  }


  /* =====================================================
     DISPLAY BOOKS
     ===================================================== */

  function displayBooks(books) {

    const grid =
      document.getElementById("booksGrid");

    grid.innerHTML = "";


    if (books.length === 0) {

      grid.innerHTML = `
        <div style="
          grid-column:1/-1;
          text-align:center;
          padding:30px;">
          📚 No books found.
        </div>
      `;

      return;

    }


    books.forEach((book, index) => {

      const card =
        document.createElement("div");

      card.className =
        "book-card";


      card.innerHTML = `

        <div class="cover-box"
             id="cover-${index}">

          <div class="cover-loading">
            📖 Loading cover...
          </div>

        </div>

        <div class="book-info">

          <div class="book-title">
            ${escapeHTML(
              removePdfExtension(book.name)
            )}
          </div>

          <div class="book-buttons">

            <a
              class="read-btn"
              href="${book.download_url}"
              target="_blank">
              📖 Read
            </a>

            <a
              class="download-btn"
              href="${book.download_url}"
              download>
              📥 Download
            </a>

          </div>

        </div>

      `;


      grid.appendChild(card);


      renderCover(
        book.download_url,
        `cover-${index}`
      );

    });

  }


  /* =====================================================
     RENDER PDF FIRST PAGE AS COVER
     ===================================================== */

  async function renderCover(
    pdfUrl,
    containerId
  ) {

    const container =
      document.getElementById(containerId);

    if (!container) return;


    if (typeof pdfjsLib === "undefined") {

      container.innerHTML =
        `<div class="cover-loading">
          📕 PDF
        </div>`;

      return;

    }


    try {

      const loadingTask =
        pdfjsLib.getDocument({
          url: pdfUrl,
          withCredentials: false
        });

      const pdf =
        await loadingTask.promise;

      const page =
        await pdf.getPage(1);


      const viewport =
        page.getViewport({
          scale: 1.2
        });


      const canvas =
        document.createElement("canvas");

      const context =
        canvas.getContext("2d");


      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;


      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


      container.innerHTML = "";

      container.appendChild(canvas);

    } catch (error) {

      console.error(
        "Cover error:",
        error
      );

      container.innerHTML =
        `<div class="cover-loading">
          📕 PDF Book
        </div>`;

    }

  }


  /* =====================================================
     SEARCH BOOKS
     ===================================================== */

  function searchBooks() {

    const search =
      document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();


    if (!search) {

      displayBooks(allBooks);

      return;

    }


    const filtered =
      allBooks.filter(book => {

        return book.name
          .toLowerCase()
          .includes(search);

      });


    displayBooks(filtered);

  }


  /* =====================================================
     REMOVE PDF EXTENSION
     ===================================================== */

  function removePdfExtension(name) {

    return name.replace(
      /\.pdf$/i,
      ""
    );

  }


  /* =====================================================
     ESCAPE HTML
     ===================================================== */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }


  /* =====================================================
     HELP MENU
     ===================================================== */

  function toggleHelp() {

    const menu =
      document.getElementById("helpMenu");

    menu.style.display =
      menu.style.display === "block"
        ? "none"
        : "block";

  }


  /* =====================================================
     OPEN AUTH MODAL
     ===================================================== */

  function openAuth(mode = "login") {

    authMode = mode;

    document
      .getElementById("authModal")
      .style.display = "flex";

    switchAuth(mode);

  }


  /* =====================================================
     CLOSE AUTH MODAL
     ===================================================== */

  function closeAuth() {

    document
      .getElementById("authModal")
      .style.display = "none";

    document
      .getElementById("authMessage")
      .innerHTML = "";

  }


  /* =====================================================
     SWITCH LOGIN / SIGNUP
     ===================================================== */

  function switchAuth(mode) {

    authMode = mode;


    const title =
      document.getElementById("authTitle");

    const submit =
      document.getElementById("authSubmit");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");


    if (mode === "login") {

      title.innerText =
        "Login";

      submit.innerText =
        "Login";

      loginTab.classList.add(
        "active"
      );

      signupTab.classList.remove(
        "active"
      );

    } else {

      title.innerText =
        "Create Account";

      submit.innerText =
        "Sign Up";

      signupTab.classList.add(
        "active"
      );

      loginTab.classList.remove(
        "active"
      );

    }


    document
      .getElementById("authMessage")
      .innerHTML = "";

  }


  /* =====================================================
     LOGIN / SIGNUP
     ===================================================== */

  async function handleAuth(event) {

    event.preventDefault();


    if (!supabaseClient) {

      document
        .getElementById("authMessage")
        .innerHTML =
        "❌ Login system load nahi hua.";

      return;

    }


    const email =
      document
        .getElementById("authEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("authPassword")
        .value;


    const message =
      document.getElementById(
        "authMessage"
      );


    message.innerHTML =
      "⏳ Please wait...";


    try {

      if (authMode === "signup") {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        if (error) {

          throw error;

        }


        message.innerHTML =
          "✅ Account created. Please check your email for confirmation.";

      } else {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          throw error;

        }


        message.innerHTML =
          "✅ Login successful!";

        setTimeout(() => {

          closeAuth();

        }, 800);

      }

    } catch (error) {

      console.error(
        "Auth error:",
        error
      );

      message.innerHTML =
        "❌ " +
        escapeHTML(
          error.message
        );

    }

  }


  /* =====================================================
     CHECK AUTH
     ===================================================== */

  async function checkAuth() {

    if (!supabaseClient) {

      updateAuthUI(null);

      updateReviewBox();

      return;

    }


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        updateAuthUI(null);

        updateReviewBox();

        return;

      }


      updateAuthUI(
        data.session
      );

      updateReviewBox();

    } catch (error) {

      console.error(
        "Session error:",
        error
      );

      updateAuthUI(null);

      updateReviewBox();

    }

  }


  /* =====================================================
     AUTH UI
     ===================================================== */

  function updateAuthUI(session) {

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const signupBtn =
      document.getElementById(
        "signupBtn"
      );

    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    if (session) {

      loginBtn.style.display =
        "none";

      signupBtn.style.display =
        "none";

      logoutBtn.style.display =
        "inline-block";

    } else {

      loginBtn.style.display =
        "inline-block";

      signupBtn.style.display =
        "inline-block";

      logoutBtn.style.display =
        "none";

    }

  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logout() {

    if (!supabaseClient) {

      return;

    }


    try {

      await supabaseClient.auth.signOut();

      alert(
        "You have been logged out."
      );

      updateAuthUI(null);

      updateReviewBox();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  /* =====================================================
     REVIEW BOX
     ===================================================== */

  async function updateReviewBox() {

    const box =
      document.getElementById(
        "reviewBox"
      );


    if (!supabaseClient) {

      box.innerHTML = `
        <div class="login-review-message">
          🔐 Please login to rate and review a book.
        </div>
      `;

      return;

    }


    try {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (!data.session) {

        box.innerHTML = `
          <div class="login-review-message">

            🔐 Please login to rate and review a book.

            <br><br>

            <button
              onclick="openAuth('login')"
              style="
                padding:10px 18px;
                border:none;
                border-radius:7px;
                background:#222;
                color:white;
                cursor:pointer;">
              Login
            </button>

          </div>
        `;

        return;

      }


      createReviewForm();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  /* =====================================================
     CREATE REVIEW FORM
     ===================================================== */

  function createReviewForm() {

    const box =
      document.getElementById(
        "reviewBox"
      );


    let options = "";

    allBooks.forEach(book => {

      options += `
        <option value="${escapeHTML(book.name)}">
          ${escapeHTML(
            removePdfExtension(book.name)
          )}
        </option>
      `;

    });


    if (allBooks.length === 0) {

      box.innerHTML = `
        <div class="login-review-message">
          📚 Books load hone ke baad review diya ja sakta hai.
        </div>
      `;

      return;

    }


    box.innerHTML = `

      <select
        id="reviewBook"
        class="review-select">

        ${options}

      </select>


      <div class="stars">

        <button
          class="star"
          onclick="selectRating(1)"
          id="star1">
          ★
        </button>

        <button
          class="star"
          onclick="selectRating(2)"
          id="star2">
          ★
        </button>

        <button
          class="star"
          onclick="selectRating(3)"
          id="star3">
          ★
        </button>

        <button
          class="star"
          onclick="selectRating(4)"
          id="star4">
          ★
        </button>

        <button
          class="star"
          onclick="selectRating(5)"
          id="star5">
          ★
        </button>

      </div>


      <textarea
        id="reviewComment"
        class="review-textarea"
        placeholder="Write your review...">
      </textarea>


      <button
        class="submit-review"
        onclick="submitReview()">
        ⭐ Submit Review
      </button>


      <div
        id="reviewMessage"
        style="
          text-align:center;
          margin-top:12px;">
      </div>

    `;

  }


  /* =====================================================
     SELECT RATING
     ===================================================== */

  function selectRating(rating) {

    if (!supabaseClient) {

      openAuth("login");

      return;

    }


    selectedRating =
      rating;


    for (
      let i = 1;
      i <= 5;
      i++
    ) {

      const star =
        document.getElementById(
          "star" + i
        );

      if (!star) continue;


      if (i <= rating) {

        star.classList.add(
          "selected"
        );

      } else {

        star.classList.remove(
          "selected"
        );

      }

    }

  }


  /* =====================================================
     SUBMIT REVIEW
     ===================================================== */

  async function submitReview() {

    if (!supabaseClient) {

      openAuth("login");

      return;

    }


    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (!data.session) {

      openAuth("login");

      return;

    }


    if (selectedRating === 0) {

      alert(
        "Please select a rating."
      );

      return;

    }


    const book =
      document
        .getElementById(
          "reviewBook"
        )
        .value;


    const comment =
      document
        .getElementById(
          "reviewComment"
        )
        .value
        .trim();


    const message =
      document.getElementById(
        "reviewMessage"
      );


    message.innerHTML =
      "⏳ Submitting...";


    try {

      await fetch(
        GOOGLE_SCRIPT_URL,
        {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            book: book,

            rating:
              selectedRating,

            comment:
              comment,

            email:
              data.session.user.email

          })

        }
      );


      message.innerHTML =
        "✅ Review submitted successfully!";


      document
        .getElementById(
          "reviewComment"
        )
        .value = "";


      selectedRating =
        0;


      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        const star =
          document.getElementById(
            "star" + i
          );

        if (star) {

          star.classList.remove(
            "selected"
          );

        }

      }


    } catch (error) {

      console.error(
        error
      );

      message.innerHTML =
        "❌ Review submit nahi ho saka.";

    }

  }


  /* =====================================================
     SUPABASE AUTH STATE LISTENER
     ===================================================== */

  function setupAuthListener() {

    if (!supabaseClient) {

      return;

    }


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth event:",
          event
        );

        updateAuthUI(session);

        updateReviewBox();

      }
    );

  }


  /* =====================================================
     START WEBSITE
     ===================================================== */

  /*
     IMPORTANT:
     Books FIRST load hongi.
     Supabase mein koi problem ho to bhi
     books rukengi nahi.
  */

  loadBooks();


  /*
     Supabase ko books ke baad initialize kar rahe hain.
  */

  initializeSupabase();

  setupAuthListener();

  checkAuth();


  /* =====================================================
     CLOSE HELP WHEN CLICKING OUTSIDE
     ===================================================== */

  document.addEventListener(
    "click",
    function(event) {

      const wrapper =
        document.querySelector(
          ".help-wrapper"
        );

      const menu =
        document.getElementById(
          "helpMenu"
        );


      if (
        wrapper &&
        !wrapper.contains(event.target)
      ) {

        menu.style.display =
          "none";

      }

    }
  );

</script>

</body>
</html>
