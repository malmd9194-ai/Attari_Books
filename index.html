<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attari Books</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #222;
    }

    header {
      background: #24170f;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      background: #3b271b;
      color: white;
      text-align: center;
      padding: 75px 20px;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search {
      width: 90%;
      max-width: 550px;
      padding: 15px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
    }

    .books {
      padding: 50px 6%;
    }

    .books h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 30px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .book {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .cover {
      height: 250px;
      background: #ddd;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      margin-bottom: 18px;
    }

    .book h3 {
      margin-bottom: 8px;
      word-break: break-word;
    }

    .author {
      color: #777;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px 7px;
      border-radius: 7px;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    .read {
      background: #24170f;
      color: white;
    }

    .download {
      background: #e5ded5;
      color: #24170f;
    }

    .message {
      text-align: center;
      padding: 30px;
      color: #777;
      grid-column: 1 / -1;
    }

    footer {
      background: #24170f;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 38px;
      }

      header {
        padding: 15px 4%;
      }

      .logo {
        font-size: 21px;
      }

      nav a {
        margin-left: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">📚 Attari Books</div>

  <nav>
    <a href="#">Home</a>
    <a href="#books">Books</a>
  </nav>
</header>


<section class="hero">

  <h1>Attari Books</h1>

  <p>Your Digital Library</p>

  <input
    class="search"
    type="text"
    id="searchBox"
    placeholder="Search books..."
    onkeyup="searchBooks()"
  >

</section>


<section class="books" id="books">

  <h2>Latest Books</h2>

  <div class="book-grid" id="bookList">

    <div class="message">
      📚 Loading books...
    </div>

  </div>

</section>


<footer
