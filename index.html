<html lang="en">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* HEADER */
    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 8px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 10px;
      border-radius: 6px;
    }

    nav a:hover {
      background: rgba(255,255,255,0.15);
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 45px 20px 30px;
      background: white;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .hero p {
      margin: 0;
      color: #666;
      font-size: 17px;
    }

    /* SEARCH */
    .search-area {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    #searchBox {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #searchBox:focus {
      border-color: #2563eb;
    }

    /* BOOK SECTION */
    #books {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    /* BOOK CARD */
    .book {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .cover {
      width: 100%;
      height: 290px;
      background: #e5e7eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cover-loading {
      text-align: center;
      color: #777;
      line-height: 1.8;
    }

    .book h3 {
      margin: 15px 0 5px;

    .author {

      margin: 0 0 12px;
      font-size: 14px;
    }

    /* READ / DOWNLOAD */
    .buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      text-decoration: none;
      text-align: center;
      padding: 10px 7px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }

    .read {
      background: #2563eb;
      color: white;
    }

    .download {
      background: #16a34a;
      color: white;
    }

    .btn:hover {
      opacity: 0.88;
    }

    /* STAR / COMMENT / SHARE */
    .social-options {
      display: flex;
      gap: 6px;
      margin-top: 5px;
    }

    .social-btn {
      flex: 1;
      border: 1px solid #ddd;
      background: white;
      padding: 9px 5px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .social-btn:hover {
      background: #f3f4f6;
    }

    .star-btn.active {
      color: #f59e0b;
      border-color: #f59e0b;
    }

    .star-count {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 5px;
    }

    /* COMMENT AREA */
    .comment-area {
      display: none;
      margin-top: 10px;
    }

    .comment-area textarea {
      width: 100%;
      min-height: 70px;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .comment-submit {
      margin-top: 7px;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .saved-comment {
      display: none;
      margin-top: 8px;
      padding: 8px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      color: #555;
    }

    /* MESSAGE */
    .message {
      grid-column: 1 / -1;
      background: white;
      padding: 35px 20px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    .retry-btn {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    /* READER */
    #reader {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 9999;
      overflow-y: auto;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #1f2937;
      color: white;
      padding: 12px 15px;
      display: flex;

      justify-content: space-between;

    }

      text-overflow: ellipsis;

    .close-reader {

      color: white;

      padding: 9px 14px;
      border-radius: 6px;

      font-weight: bold;

  <script>

    /* =========================
       GITHUB SETTINGS
    ========================= */

    const GITHUB_OWNER = "malmd9194-ai";
    const GITHUB_REPO = "Attari_Books";
    const GITHUB_BRANCH = "main";


    /* =========================
       PDF.JS
    ========================= */

    if (typeof pdfjsLib !== "undefined") {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }


    /* =========================
       LOAD BOOKS
    ========================= */

    async function loadBooks() {

      const bookList = document.getElementById("bookList");

      bookList.innerHTML = `
        <div class="message">
          📚 Loading books...
        </div>
      `;

      try {

        const apiUrl =
          `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

        /*
          Timeout added so site does not remain
          stuck on "Loading books" forever.
        */

        const controller = new AbortController();

        const timeout = setTimeout(() => {
          controller.abort();
        }, 15000);


        const response = await fetch(apiUrl, {
          signal: controller.signal,
          cache: "no-store"
        });

        clearTimeout(timeout);


        if (!response.ok) {

          if (response.status === 403) {
            throw new Error(
              "GitHub API limit reached. Please try again later."
            );
          }

          if (response.status === 404) {
            throw new Error(
              "GitHub repository not found. Check repository name and branch."
            );
          }

          throw new Error(
            "GitHub API Error: " + response.status
          );
        }


        const files = await response.json();


        if (!Array.isArray(files)) {
          throw new Error(
            "GitHub returned an unexpected response."
          );
        }


        /*
          Only PDF files in the ROOT of repository
          are automatically shown.
        */

        const pdfFiles = files.filter(file =>
          file &&
          file.type === "file" &&
          typeof file.name === "string" &&
          file.name.toLowerCase().endsWith(".pdf")
        );


        bookList.innerHTML = "";


        if (pdfFiles.length === 0) {

          bookList.innerHTML = `
            <div class="message">

              📚 No PDF books found.

              <br><br>

              PDF files ko GitHub repository ke
              <b>main/root folder</b> mein upload karein.

            </div>
          `;

          return;
        }


        pdfFiles.forEach(file => {

          createBookCard(file, bookList);

        });


      } catch (error) {

        console.error("Books loading error:", error);

        let message =
          "⚠️ Books load nahi ho pa rahi hain.";

        if (error.name === "AbortError") {
          message =
            "⏱️ GitHub se response bahut late aa raha hai.";
        } else if (error.message) {
          message = "⚠️ " + error.message;
        }


        bookList.innerHTML = `
          <div class="message">

            ${escapeHTML(message)}

            <br><br>

            <button
              class="retry-btn"
              onclick="loadBooks()">
              🔄 Retry
            </button>

          </div>
        `;
      }
    }


    /* =========================
       CREATE BOOK CARD
    ========================= */

    function createBookCard(file, bookList) {

      const bookName = file.name
        .replace(/\.pdf$/i, "")
        .replace(/[_-]/g, " ")
        .trim();


      const encodedFileName =
        encodeURIComponent(file.name);


      const pdfUrl =
        `https://raw.githubusercontent.com/` +
        `${GITHUB_OWNER}/` +
        `${GITHUB_REPO}/` +
        `${GITHUB_BRANCH}/` +
        `${encodedFileName}`;


      const bookId =
        "book_" +
        btoa(unescape(encodeURIComponent(file.name)))
          .replace(/[^a-zA-Z0-9]/g, "")
          .substring(0, 40);


      const book = document.createElement("div");

      book.className = "book";

      book.dataset.title = bookName.toLowerCase();


      book.innerHTML = `

        <!-- COVER -->

        <div class="cover">

          <div class="cover-loading">
            📖<br>
            Loading cover...
          </div>

        </div>


        <!-- BOOK NAME -->

        <h3>
          ${escapeHTML(bookName)}
        </h3>


        <p class="author">
          Attari Books
        </p>


        <!-- READ / DOWNLOAD -->

        <div class="buttons">

          <button
            class="btn read"
            onclick="openReader(
              '${escapeJS(pdfUrl)}',
              '${escapeJS(bookName)}'
            )">

            📖 Read

          </button>


          <a
            href="${escapeHTML(pdfUrl)}"
            class="btn download"
            download>

            ⬇ Download

          </a>

        </div>


        <!-- STAR / COMMENT / SHARE -->

        <div class="social-options">

          <button
            class="social-btn star-btn"
            id="${bookId}_star"
            onclick="toggleStar('${escapeJS(bookId)}')">

            ☆ Star

          </button>


          <button
            class="social-btn"
            onclick="toggleComment('${escapeJS(bookId)}')">

            💬 Comment

          </button>


          <button
            class="social-btn"
            onclick="shareBook(
              '${escapeJS(bookName)}',
              '${escapeJS(pdfUrl)}'
            )">

            📤 Share

          </button>

        </div>


        <div
          class="star-count"
          id="${bookId}_count">

          0 Stars

        </div>


        <!-- COMMENT BOX -->

        <div
          class="comment-area"
          id="${bookId}_comments">

          <textarea
            id="${bookId}_textarea"
            placeholder="Write your comment..."></textarea>

          <button
            class="comment-submit"
            onclick="saveComment('${escapeJS(bookId)}')">

            Post Comment

          </button>

          <div
            class="saved-comment"
            id="${bookId}_saved">
          </div>

        </div>

      `;


      bookList.appendChild(book);


      /* Load first PDF page as cover */

      const cover =
        book.querySelector(".cover");

      loadCover(pdfUrl, cover);


      /* Load saved star/comment */

      loadSavedSocialData(bookId);
    }


    /* =========================
       LOAD PDF COVER
    ========================= */

    async function loadCover(pdfUrl, cover) {

      try {

        if (typeof pdfjsLib === "undefined") {
          throw new Error("PDF.js not loaded");
        }


        const pdf =
          await pdfjsLib
            .getDocument({
              url: pdfUrl
            })
            .promise;


        const page =
          await pdf.getPage(1);


        const viewport =
          page.getViewport({
            scale: 1.2
          });


        const canvas =
          document.createElement("canvas");


        const context =
          canvas.getContext("2d");


        canvas.width =
          viewport.width;

        canvas.height =
          viewport.height;


        cover.innerHTML = "";

        cover.appendChild(canvas);


        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;


      } catch (error) {

        console.error(
          "Cover error:",
          error
        );

        cover.innerHTML = `
          <div class="cover-loading">
            📖
          </div>
        `;
      }
    }


    /* =========================
       PDF READER
    ========================= */

    async function openReader(pdfUrl, title) {

      const reader =
        document.getElementById("reader");

      const readerTitle =
        document.getElementById("readerTitle");

      const pdfPages =
        document.getElementById("pdfPages");


      reader.style.display = "block";

      document.body.style.overflow = "hidden";

      readerTitle.textContent = title;


      pdfPages.innerHTML = `
        <div style="
          color:white;
          padding:30px;
          text-align:center;
        ">
          📖 Book loading...
        </div>
      `;


      try {

        if (typeof pdfjsLib === "undefined") {
          throw new Error("PDF reader library not loaded.");
        }


        const pdf =
          await pdfjsLib
            .getDocument({
              url: pdfUrl
            })
            .promise;


        pdfPages.innerHTML = "";


        for (
          let pageNumber = 1;
          pageNumber <= pdf.numPages;
          pageNumber++
        ) {

          const page =
            await pdf.getPage(pageNumber);


          const viewport =
            page.getViewport({
              scale: 1.3
            });


          const canvas =
            document.createElement("canvas");


          const context =
            canvas.getContext("2d");


          canvas.width =
            viewport.width;

          canvas.height =
            viewport.height;


          pdfPages.appendChild(canvas);


          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }


      } catch (error) {

        console.error(
          "PDF reader error:",
          error
        );


        pdfPages.innerHTML = `
          <div style="
            color:white;
            text-align:center;
            padding:40px;
          ">

            ⚠️ PDF open nahi ho pa rahi.

            <br><br>

            Please internet connection
            check karein.

          </div>
        `;
      }
    }


    /* =========================
       CLOSE READER
    ========================= */

    function closeReader() {

      document.getElementById(
        "reader"
      ).style.display = "none";


      document.body.style.overflow = "";


      document.getElementById(
        "pdfPages"
      ).innerHTML = "";
    }


    /* =========================
       SEARCH
    ========================= */

    function searchBooks() {

      const search =
        document
          .getElementById("searchBox")
          .value
          .toLowerCase()
          .trim();


      const books =
        document.querySelectorAll(".book");


      books.forEach(book => {

        const title =
          book.dataset.title || "";


        book.style.display =
          title.includes(search)
            ? ""
            : "none";
      });
    }
