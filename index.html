  <style>

    .modal {

    .modal-box {

    /* =========================

    .review-section {

    /* =========================

<script>

  /* =====================================================
     SUPABASE
     ===================================================== */

  const SUPABASE_URL =
    "https://kihhuilyeosvpozduwcs.supabase.co";

  /*
     IMPORTANT:
     Yahan current Publishable key hai.
     Secret key kabhi yahan nahi lagani.
  */

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_-XN0lujfPGCeIzusrlUfkQ_-lFKXwUs";

  let supabaseClient = null;


  /* =====================================================
     GOOGLE SHEETS
     ===================================================== */

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


  /* =====================================================
     GITHUB
     ===================================================== */

  const GITHUB_OWNER =
    "malmd9194-ai";

  const GITHUB_REPO =
    "Attari_Books";

  const GITHUB_BRANCH =
    "main";


  /* =====================================================
     VARIABLES
     ===================================================== */

  let allBooks = [];

  let selectedRating = 0;

  let authMode = "login";

  let readerPdf = null;

  let readerCurrentPage = 1;


  /* =====================================================
     PDF.JS WORKER
     ===================================================== */

  if (typeof pdfjsLib !== "undefined") {

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  }


  /* =====================================================
     INITIALIZE SUPABASE
     ===================================================== */

  function initializeSupabase() {

    try {

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ) {

        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );

        console.log(
          "Supabase connected."
        );

      } else {

        console.error(
          "Supabase library load nahi hui."
        );

      }

    } catch (error) {

      console.error(
        "Supabase initialization error:",
        error
      );

    }

  }


  /* =====================================================
     AUTH ERROR MESSAGE
     ===================================================== */

  function getAuthErrorMessage(error) {

    const msg =
      error?.message ||
      String(error || "");

    if (
      /invalid api key/i.test(msg)
    ) {

      return "❌ Supabase API key invalid hai. Settings → API Keys se current Publishable key check karein.";

    }

    if (
      /email not confirmed/i.test(msg)
    ) {

      return "❌ Pehle apni email inbox mein Supabase confirmation link se email verify karein.";

    }

    if (
      /invalid login credentials/i.test(msg)
    ) {

      return "❌ Email ya password incorrect hai.";

    }

    return "❌ " + msg;

  }


  /* =====================================================
     LOAD BOOKS FROM GITHUB
     ===================================================== */

  async function loadBooks() {

    const status =
      document.getElementById("status");

    const grid =
      document.getElementById("booksGrid");

    status.innerHTML =
      "📚 Loading books...";

    grid.innerHTML = "";

    try {

      const apiUrl =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

      const response =
        await fetch(apiUrl);

      if (!response.ok) {

        throw new Error(
          "GitHub API Error: " +
          response.status
        );

      }

      const files =
        await response.json();

      console.log(
        "GitHub files:",
        files
      );

      const pdfFiles =
        files.filter(file => {

          return (
            file.type === "file" &&
            file.name
              .toLowerCase()
              .endsWith(".pdf")
          );

        });

      if (pdfFiles.length === 0) {

        status.innerHTML =
          "📚 No PDF books found.";

        updateReviewBox();

        return;

      }

      allBooks =
        pdfFiles.map(file => {

          return {

            name:
              file.name,

            download_url:
              file.download_url,

            html_url:
              file.html_url

          };

        });

      status.innerHTML =
        `${allBooks.length} book(s) available`;

      displayBooks(
        allBooks
      );

      updateReviewBox();

    } catch (error) {

      console.error(
        "Books loading error:",
        error
      );

      status.innerHTML =
        "❌ Books load nahi ho pa rahe.";

      grid.innerHTML = `

        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:30px;
            color:#777;">

          <p>
            GitHub se books load nahi ho pa rahi hain.
          </p>

          <p
            style="
              font-size:13px;
              margin-top:10px;">

            Please page refresh karke dobara try karein.

          </p>

        </div>

      `;

    }

  }


  /* =====================================================
     DISPLAY BOOKS
     ===================================================== */

  function displayBooks(books) {

    const grid =
      document.getElementById(
        "booksGrid"
      );

    grid.innerHTML = "";

    if (books.length === 0) {

      grid.innerHTML = `

        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:30px;">

          📚 No books found.

        </div>

      `;

      return;

    }

    books.forEach(
      (book, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "book-card";

        /*
          Search ke baad bhi correct book open ho,
          isliye allBooks mein original index nikal rahe hain.
        */

        const originalIndex =
          allBooks.indexOf(book);

        card.innerHTML = `

          <div
            class="cover-box"
            id="cover-${index}">

            <div class="cover-loading">
              📖 Loading cover...
            </div>

          </div>

          <div class="book-info">

            <div class="book-title">
              ${escapeHTML(
                removePdfExtension(
                  book.name
                )
              )}
            </div>

            <div class="book-buttons">

              <button
                class="read-btn"
                onclick="openReader(${originalIndex})">

                📖 Read

              </button>

              <a
                class="download-btn"
                href="${book.download_url}"
                download>

                📥 Download

              </a>

            </div>

          </div>

        `;

        grid.appendChild(
          card
        );

        renderCover(
          book.download_url,
          `cover-${index}`
        );

      }
    );

  }


  /* =====================================================
     PDF COVER
     ===================================================== */

  async function renderCover(
    pdfUrl,
    containerId
  ) {

    const container =
      document.getElementById(
        containerId
      );

    if (!container) return;

    if (
      typeof pdfjsLib ===
      "undefined"
    ) {

      container.innerHTML =
        `<div class="cover-loading">
          📕 PDF
        </div>`;

      return;

    }

    try {

      const loadingTask =
        pdfjsLib.getDocument({

          url:
            pdfUrl,

          withCredentials:
            false

        });

      const pdf =
        await loadingTask.promise;

      const page =
        await pdf.getPage(1);

      const viewport =
        page.getViewport({
          scale: 1.2
        });

      const canvas =
        document.createElement(
          "canvas"
        );

      const context =
        canvas.getContext("2d");

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;

      await page.render({

        canvasContext:
          context,

        viewport:
          viewport

      }).promise;

      container.innerHTML = "";

      container.appendChild(
        canvas
      );

    } catch (error) {

      console.error(
        "Cover error:",
        error
      );

      container.innerHTML =
        `<div class="cover-loading">
          📕 PDF Book
        </div>`;

    }

  }


  /* =====================================================
     SEARCH
     ===================================================== */

  function searchBooks() {

    const search =
      document
        .getElementById(
          "searchBox"
        )
        .value
        .toLowerCase()
        .trim();

    if (!search) {

      displayBooks(
        allBooks
      );

      return;

    }

    const filtered =
      allBooks.filter(
        book => {

          return book.name
            .toLowerCase()
            .includes(search);

        }
      );

    displayBooks(
      filtered
    );

  }


  /* =====================================================
     REMOVE PDF EXTENSION
     ===================================================== */

  function removePdfExtension(
    name
  ) {

    return name.replace(
      /\.pdf$/i,
      ""
    );

  }


  /* =====================================================
     ESCAPE HTML
     ===================================================== */

  function escapeHTML(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      text;

    return div.innerHTML;

  }


  /* =====================================================
     HELP MENU
     ===================================================== */

  function toggleHelp() {

    const menu =
      document.getElementById(
        "helpMenu"
      );

    menu.style.display =
      menu.style.display ===
      "block"
        ? "none"
        : "block";

  }


  /* =====================================================
     OPEN AUTH
     ===================================================== */

  function openAuth(
    mode = "login"
  ) {

    authMode =
      mode;

    document
      .getElementById(
        "authModal"
      )
      .style.display =
      "flex";

    switchAuth(
      mode
    );

  }


  /* =====================================================
     CLOSE AUTH
     ===================================================== */

  function closeAuth() {

    document
      .getElementById(
        "authModal"
      )
      .style.display =
      "none";

    document
      .getElementById(
        "authMessage"
      )
      .innerHTML =
      "";

  }


  /* =====================================================
     SWITCH LOGIN / SIGNUP
     ===================================================== */

  function switchAuth(
    mode
  ) {

    authMode =
      mode;

    const title =
      document.getElementById(
        "authTitle"
      );

    const submit =
      document.getElementById(
        "authSubmit"
      );

    const loginTab =
      document.getElementById(
        "loginTab"
      );

    const signupTab =
      document.getElementById(
        "signupTab"
      );

    if (
      mode === "login"
    ) {

      title.innerText =
        "Login";

      submit.innerText =
        "Login";

      loginTab.classList.add(
        "active"
      );

      signupTab.classList.remove(
        "active"
      );

    } else {

      title.innerText =
        "Create Account";

      submit.innerText =
        "Sign Up";

      signupTab.classList.add(
        "active"
      );

      loginTab.classList.remove(
        "active"
      );

    }

    document
      .getElementById(
        "authMessage"
      )
      .innerHTML =
      "";

  }


  /* =====================================================
     LOGIN / SIGNUP
     ===================================================== */

  async function handleAuth(
    event
  ) {

    event.preventDefault();

    const message =
      document.getElementById(
        "authMessage"
      );

    if (!supabaseClient) {

      message.innerHTML =
        "❌ Login system load nahi hua.";

      return;

    }

    const email =
      document
        .getElementById(
          "authEmail"
        )
        .value
        .trim();

    const password =
      document
        .getElementById(
          "authPassword"
        )
        .value;

    message.innerHTML =
      "⏳ Please wait...";

    try {

      /* SIGN UP */

      if (
        authMode ===
        "signup"
      ) {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email:
              email,

            password:
              password

          });

        if (error) {

          throw error;

        }

        /*
          Confirm email ON hone ki wajah se
          user ko email verify karni hogi.
        */

        if (
          data?.user &&
          !data?.session
        ) {

          message.innerHTML =
            "✅ Account created. Please check your email and confirm your account.";

        } else {

          message.innerHTML =
            "✅ Account created successfully.";

        }

      }

      /* LOGIN */

      else {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email:
              email,

            password:
              password

          });

        if (error) {

          throw error;

        }

        message.innerHTML =
          "✅ Login successful!";

        setTimeout(
          () => {

            closeAuth();

          },
          800
        );

      }

    } catch (error) {

      console.error(
        "Auth error:",
        error
      );

      message.textContent =
        getAuthErrorMessage(
          error
        );

    }

  }


  /* =====================================================
     CHECK AUTH
     ===================================================== */

  async function checkAuth() {

    if (!supabaseClient) {

      updateAuthUI(
        null
      );

      updateReviewBox();

      return;

    }

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();

      if (error) {

        console.error(
          error
        );

        updateAuthUI(
          null
        );

        updateReviewBox();

        return;

      }

      updateAuthUI(
        data.session
      );

      updateReviewBox();

    } catch (error) {

      console.error(
        "Session error:",
        error
      );

      updateAuthUI(
        null
      );

      updateReviewBox();

    }

  }


  /* =====================================================
     UPDATE AUTH BUTTONS
     ===================================================== */

  function updateAuthUI(
    session
  ) {

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const signupBtn =
      document.getElementById(
        "signupBtn"
      );

    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );

    if (session) {

      loginBtn.style.display =
        "none";

      signupBtn.style.display =
        "none";

      logoutBtn.style.display =
        "inline-block";

    } else {

      loginBtn.style.display =
        "inline-block";

      signupBtn.style.display =
        "inline-block";

      logoutBtn.style.display =
        "none";

    }

  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logout() {

    if (!supabaseClient) {

      return;

    }

    try {

      const {
        error
      } =
        await supabaseClient.auth.signOut();

      if (error) {

        throw error;

      }

      alert(
        "You have been logged out."
      );

      updateAuthUI(
        null
      );

      updateReviewBox();

    } catch (error) {

      console.error(
        error
      );

      alert(
        "Logout nahi ho saka."
      );

    }

  }


  /* =====================================================
     REVIEW BOX
     ===================================================== */

  async function updateReviewBox() {

    const box =
      document.getElementById(
        "reviewBox"
      );

    if (!supabaseClient) {

      box.innerHTML = `

        <div class="login-review-message">

          🔐 Please login to rate and review a book.

        </div>

      `;

      return;

    }

    try {

      const {
        data
      } =
        await supabaseClient.auth.getSession();

      if (
        !data.session
      ) {

        box.innerHTML = `

          <div class="login-review-message">

            🔐 Please login to rate and review a book.

            <br><br>

            <button
              onclick="openAuth('login')"
              style="
                padding:10px 18px;
                border:none;
                border-radius:7px;
                background:#222;
                color:white;
                cursor:pointer;">

              Login

            </button>

          </div>

        `;

        return;

      }

      createReviewForm();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  /* =====================================================
     REVIEW FORM
     ===================================================== */

  function createReviewForm() {

    const box =
      document.getElementById(
        "reviewBox"
      );

    let options =
      "";

    allBooks.forEach(
      book => {

        options += `

          <option value="${escapeHTML(book.name)}">

            ${escapeHTML(
              removePdfExtension(
                book.name
              )
            )}

          </option>

        `;

      }
    );

    if (
      allBooks.length === 0
    ) {

      box.innerHTML = `

        <div class="login-review-message">

          📚 Books load hone ke baad review diya ja sakta hai.

        </div>

      `;

      return;

    }

    box.innerHTML = `

      <select
        id="reviewBook"
        class="review-select">

        ${options}

      </select>

      <div class="stars">

        <button
          type="button"
          class="star"
          onclick="selectRating(1)"
          id="star1">
          ★
        </button>

        <button
          type="button"
          class="star"
          onclick="selectRating(2)"
          id="star2">
          ★
        </button>

        <button
          type="button"
          class="star"
          onclick="selectRating(3)"
          id="star3">
          ★
        </button>

        <button
          type="button"
          class="star"
          onclick="selectRating(4)"
          id="star4">
          ★
        </button>

        <button
          type="button"
          class="star"
          onclick="selectRating(5)"
          id="star5">
          ★
        </button>

      </div>

      <textarea
        id="reviewComment"
        class="review-textarea"
        placeholder="Write your review...">
      </textarea>

      <button
        class="submit-review"
        onclick="submitReview()">

        ⭐ Submit Review

      </button>

      <div
        id="reviewMessage"
        style="
          text-align:center;
          margin-top:12px;">
      </div>

    `;

    /*
      Agar user dobara review form khole,
      rating reset rahe.
    */

    selectedRating = 0;

  }


  /* =====================================================
     SELECT STAR
     ===================================================== */

  function selectRating(
    rating
  ) {

    if (!supabaseClient) {

      openAuth(
        "login"
      );

      return;

    }

    selectedRating =
      rating;

    for (
      let i = 1;
      i <= 5;
      i++
    ) {

      const star =
        document.getElementById(
          "star" + i
        );

      if (!star) {
        continue;
      }

      if (
        i <= rating
      ) {

        star.classList.add(
          "selected"
        );

      } else {

        star.classList.remove(
          "selected"
        );

      }

    }

  }


  /* =====================================================
     SUBMIT REVIEW
     ===================================================== */

  async function submitReview() {

    if (!supabaseClient) {

      openAuth(
        "login"
      );

      return;

    }

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    if (!data.session) {

      openAuth(
        "login"
      );

      return;

    }

    if (
      selectedRating === 0
    ) {

      alert(
        "Please select a rating."
      );

      return;

    }

    const book =
      document
        .getElementById(
          "reviewBook"
        )
        .value;

    const comment =
      document
        .getElementById(
          "reviewComment"
        )
        .value
        .trim();

    const message =
      document.getElementById(
        "reviewMessage"
      );

    message.innerHTML =
      "⏳ Submitting...";

    try {

      await fetch(
        GOOGLE_SCRIPT_URL,
        {

          method:
            "POST",

          mode:
            "no-cors",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              book:
                book,

              rating:
                selectedRating,

              comment:
                comment,

              email:
                data.session.user.email

            })

        }
      );

      message.innerHTML =
        "✅ Review submitted successfully!";

      document
        .getElementById(
          "reviewComment"
        )
        .value =
        "";

      selectedRating =
        0;

      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        const star =
          document.getElementById(
            "star" + i
          );

        if (star) {

          star.classList.remove(
            "selected"
          );

        }

      }

    } catch (error) {

      console.error(
        error
      );

      message.innerHTML =
        "❌ Review submit nahi ho saka.";

    }

  }


  /* =====================================================
     AUTH STATE LISTENER
     ===================================================== */

  function setupAuthListener() {

    if (!supabaseClient) {

      return;

    }

    supabaseClient.auth.onAuthStateChange(
      (
        event,
        session
      ) => {

        console.log(
          "Auth event:",
          event
        );

        updateAuthUI(
          session
        );

        updateReviewBox();

      }
    );

  }


  /* =====================================================
     OPEN PDF READER
     ===================================================== */

  async function openReader(
    bookIndex
  ) {

    const book =
      allBooks[
        bookIndex
      ];

    if (!book) {

      return;

    }

    if (
      typeof pdfjsLib ===
      "undefined"
    ) {

      alert(
        "PDF Reader load nahi hua. Page refresh karein."
      );

      return;

    }

    const readerModal =
      document.getElementById(
        "readerModal"
      );

    const loading =
      document.getElementById(
        "readerLoading"
      );

    const readerTitle =
      document.getElementById(
        "readerTitle"
      );

    readerModal.style.display =
      "flex";

    loading.style.display =
      "block";

    loading.innerHTML =
      "📖 Loading PDF...";

    readerTitle.innerText =
      removePdfExtension(
        book.name
      );

    readerCurrentPage =
      1;

    readerPdf =
      null;

    try {

      const loadingTask =
        pdfjsLib.getDocument({

          url:
            book.download_url,

          withCredentials:
            false

        });

      readerPdf =
        await loadingTask.promise;

      await renderReaderPage(
        readerCurrentPage
      );

    } catch (error) {

      console.error(
        "Reader error:",
        error
      );

      loading.style.display =
        "block";

      loading.innerHTML =
        "❌ PDF open nahi ho saki.";

    }

  }


  /* =====================================================
     RENDER READER PAGE
     ===================================================== */

  async function renderReaderPage(
    pageNumber
  ) {

    if (!readerPdf) {

      return;

    }

    const loading =
      document.getElementById(
        "readerLoading"
      );

    loading.style.display =
      "block";

    loading.innerHTML =
      "📖 Loading page...";

    try {

      const page =
        await readerPdf.getPage(
          pageNumber
        );

      const canvas =
        document.getElementById(
          "readerCanvas"
        );

      const context =
        canvas.getContext(
          "2d"
        );

      const container =
        document.querySelector(
          ".reader-content"
        );

      let scale =
        1.4;

      const availableWidth =
        container.clientWidth -
        40;

      const originalViewport =
        page.getViewport({
          scale: 1
        });

      if (
        originalViewport.width *
        scale >
        availableWidth
      ) {

        scale =
          availableWidth /
          originalViewport.width;

      }

      const viewport =
        page.getViewport({

          scale:
            Math.max(
              scale,
              0.8
            )

        });

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;

      await page.render({

        canvasContext:
          context,

        viewport:
          viewport

      }).promise;

      loading.style.display =
        "none";

      document.getElementById(
        "readerPage"
      ).innerText =
        `Page ${pageNumber} / ${readerPdf.numPages}`;

    } catch (error) {

      console.error(
        "Page render error:",
        error
      );

      loading.style.display =
        "block";

      loading.innerHTML =
        "❌ Page load nahi ho saka.";

    }

  }


  /* =====================================================
     NEXT PAGE
     ===================================================== */

  async function nextPage() {

    if (!readerPdf) {

      return;

    }

    if (
      readerCurrentPage <
      readerPdf.numPages
    ) {

      readerCurrentPage++;

      await renderReaderPage(
        readerCurrentPage
      );

    }

  }


  /* =====================================================
     PREVIOUS PAGE
     ===================================================== */

  async function previousPage() {

    if (!readerPdf) {

      return;

    }

    if (
      readerCurrentPage >
      1
    ) {

      readerCurrentPage--;

      await renderReaderPage(
        readerCurrentPage
      );

    }

  }


  /* =====================================================
     CLOSE READER
     ===================================================== */

  function closeReader() {

    const readerModal =
      document.getElementById(
        "readerModal"
      );

    readerModal.style.display =
      "none";

    readerPdf =
      null;

    readerCurrentPage =
      1;

    const canvas =
      document.getElementById(
        "readerCanvas"
      );

    const context =
      canvas.getContext(
        "2d"
      );

    context.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /* =====================================================
     KEYBOARD CONTROLS
     ===================================================== */

  document.addEventListener(
    "keydown",
    function(event) {

      const reader =
        document.getElementById(
          "readerModal"
        );

      if (
        reader.style.display !==
        "flex"
      ) {

        return;

      }

      if (
        event.key ===
        "ArrowRight"
      ) {

        nextPage();

      }

      if (
        event.key ===
        "ArrowLeft"
      ) {

        previousPage();

      }

      if (
        event.key ===
        "Escape"
      ) {

        closeReader();

      }

    }
  );


  /* =====================================================
     CLICK OUTSIDE HELP
     ===================================================== */

  document.addEventListener(
    "click",
    function(event) {

      const wrapper =
        document.querySelector(
          ".help-wrapper"
        );

      const menu =
        document.getElementById(
          "helpMenu"
        );

      if (
        wrapper &&
        !wrapper.contains(
          event.target
        )
      ) {

        menu.style.display =
          "none";

      }

    }
  );


  /* =====================================================
     START WEBSITE
     ===================================================== */

  /*
     Pehle books load hongi.
     Phir Supabase initialize hoga.
  */

  loadBooks();

  initializeSupabase();

  setupAuthListener();

  checkAuth();

</script>
