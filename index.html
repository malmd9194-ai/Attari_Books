<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attari Books</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f3ef;
  color:#222;
}

header{
  background:#24170f;
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

nav{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:bold;
}

.help-menu{
  position:relative;
  display:inline-block;
}

.help-button{
  background:none;
  border:none;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.help-options{
  display:none;
  position:absolute;
  right:0;
  top:30px;
  background:white;
  min-width:190px;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  overflow:hidden;
  z-index:1000;
}

.help-options a{
  display:block;
  color:#24170f;
  text-decoration:none;
  padding:13px 15px;
  font-size:14px;
}

.help-options a:hover{
  background:#f5f3ef;
}

.help-menu:hover .help-options{
  display:block;
}

.hero{
  background:#3b271b;
  color:white;
  text-align:center;
  padding:75px 20px;
}

.hero h1{
  font-size:45px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  margin-bottom:25px;
}

.search{
  width:90%;
  max-width:550px;
  padding:15px;
  border:none;
  border-radius:30px;
  font-size:16px;
  outline:none;
}

.books{
  padding:50px 6%;
}

.books h2{
  text-align:center;
  margin-bottom:30px;
  font-size:30px;
}

.book-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.book{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.cover{
  height:280px;
  background:#ddd;
  border-radius:8px;
  margin-bottom:18px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover canvas{
  width:100%;
  height:100%;
  object-fit:contain;
}

.cover-loading{
  color:#777;
  text-align:center;
}

.book h3{
  margin-bottom:8px;
  word-break:break-word;
  font-size:19px;
}

.author{
  color:#777;
  margin-bottom:15px;
}

.buttons{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:11px 7px;
  border-radius:7px;
  text-decoration:none;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  border:none;
  font-size:14px;
}

.read{
  background:#24170f;
  color:white;
}

.download{
  background:#e5ded5;
  color:#24170f;
}

/* REVIEW AREA */

.review-box{
  margin-top:18px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.stars{
  display:flex;
  gap:3px;
  margin-bottom:10px;
}

.star{
  font-size:25px;
  cursor:pointer;
  color:#ccc;
  user-select:none;
}

.star.selected{
  color:#f5a623;
}

.review-input{
  width:100%;
  min-height:70px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:7px;
  resize:vertical;
  font-family:Arial,sans-serif;
}

.review-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.review-submit,
.share-btn{
  border:none;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

.review-submit{
  background:#24170f;
  color:white;
}

.share-btn{
  background:#e5ded5;
  color:#24170f;
}

.review-message{
  font-size:13px;
  color:#777;
  margin-top:8px;
}

.review-summary{
  margin-top:12px;
  font-size:14px;
  font-weight:bold;
}

.comments{
  margin-top:12px;
  max-height:220px;
  overflow-y:auto;
}

.comment{
  background:#f7f5f2;
  border-radius:7px;
  padding:9px;
  margin-top:7px;
  font-size:13px;
}

.comment-stars{
  color:#f5a623;
  margin-bottom:4px;
}

.comment-text{
  word-break:break-word;
}

.message{
  text-align:center;
  padding:30px;
  color:#777;
  grid-column:1/-1;
}

/* READER */

#reader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:9999;
  overflow:auto;
}

.reader-top{
  position:sticky;
  top:0;
  background:#24170f;
  color:white;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:10;
}

.reader-title{
  font-weight:bold;
  max-width:75%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.close-reader{
  background:white;
  color:#24170f;
  border:none;
  border-radius:6px;
  padding:8px 12px;
  font-weight:bold;
  cursor:pointer;
}

#pdfPages{
  padding:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

#pdfPages canvas{
  max-width:100%;
  height:auto;
  background:white;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
}

footer{
  background:#24170f;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:600px){

  .hero h1{
    font-size:38px;
  }

  header{
    padding:15px 4%;
    justify-content:center;
  }

  .logo{
    font-size:21px;
  }

  nav{
    justify-content:center;
    gap:14px;
  }

  nav a,
  .help-button{
    font-size:13px;
  }

  .cover{
    height:300px;
  }

}

</style>

</head>

<body>

<header>

<div class="logo">
📚 Attari Books
</div>

<nav>

<a href="#">Home</a>

<a href="#books">Books</a>

<div class="help-menu">

<button
class="help-button"
onclick="toggleHelp(event)"
>
Help
</button>

<div
class="help-options"
id="helpOptions"
>

<a
href="https://wa.me/919534646778"
target="_blank"
>
💬 WhatsApp
</a>

<a
href="mailto:mdmalek26234@gmail.com"
>
✉️ Gmail / Email
</a>

</div>

</div>

</nav>

</header>


<section class="hero">

<h1>Attari Books</h1>

<p>Your Digital Library</p>

<input
class="search"
type="text"
id="searchBox"
placeholder="Search books..."
onkeyup="searchBooks()"
>

</section>


<section
class="books"
id="books"
>

<h2>Latest Books</h2>

<div
class="book-grid"
id="bookList"
>

<div class="message">
📚 Loading books...
</div>

</div>

</section>


<div id="reader">

<div class="reader-top">

<div
class="reader-title"
id="readerTitle"
>
PDF Reader
</div>

<button
class="close-reader"
onclick="closeReader()"
>
✕ Close
</button>

</div>

<div id="pdfPages"></div>

</div>


<footer>
© 2026 Attari Books — All Rights Reserved
</footer>


<script>

/* =====================================
   GOOGLE APPS SCRIPT URL
===================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


/* =====================================
   GITHUB SETTINGS
===================================== */

const GITHUB_OWNER =
"malmd9194-ai";

const GITHUB_REPO =
"Attari_Books";

const GITHUB_BRANCH =
"main";


/* =====================================
   PDF.JS
===================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================
   HELP
===================================== */

function toggleHelp(event){

event.stopPropagation();

const menu =
document.getElementById("helpOptions");

menu.style.display =
menu.style.display === "block"
? "none"
: "block";

}

document.addEventListener(
"click",
function(){

document.getElementById(
"helpOptions"
).style.display="none";

}
);


/* =====================================
   LOAD BOOKS
===================================== */

async function loadBooks(){

const bookList =
document.getElementById("bookList");

try{

const apiUrl =
`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

const response =
await fetch(apiUrl);

if(!response.ok){

throw new Error(
"GitHub API Error: " + response.status
);

}

const files =
await response.json();

const pdfFiles =
files.filter(file =>
file.type === "file" &&
file.name.toLowerCase().endsWith(".pdf")
);

bookList.innerHTML="";

if(pdfFiles.length===0){

bookList.innerHTML=`

<div class="message">

📚 No PDF books found.

<br><br>

GitHub repository me PDF upload karein.

</div>

`;

return;

}

pdfFiles.forEach(file=>{

const bookName =
file.name
.replace(/\.pdf$/i,"")
.replace(/[_-]/g," ");

const encodedFileName =
encodeURIComponent(file.name);

const pdfUrl =
`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodedFileName}`;

const book =
document.createElement("div");

book.className="book";

book.innerHTML=`

<div class="cover">

<div class="cover-loading">

📖
<br>
Loading cover...

</div>

</div>

<h3>${escapeHTML(bookName)}</h3>

<p class="author">
Attari Books
</p>

<div class="buttons">

<button
class="btn read"
onclick="openReader(
'${escapeJS(pdfUrl)}',
'${escapeJS(bookName)}'
)"
>
📖 Read
</button>

<a
href="${escapeHTML(pdfUrl)}"
class="btn download"
download
>
⬇ Download
</a>

</div>


<div class="review-box">

<div class="stars">

<span
class="star"
onclick="selectRating(this,1)"
>★</span>

<span
class="star"
onclick="selectRating(this,2)"
>★</span>

<span
class="star"
onclick="selectRating(this,3)"
>★</span>

<span
class="star"
onclick="selectRating(this,4)"
>★</span>

<span
class="star"
onclick="selectRating(this,5)"
>★</span>

</div>


<textarea
class="review-input"
placeholder="Apna comment likhein..."
></textarea>


<div class="review-actions">

<button
class="review-submit"
onclick="submitReview(
this,
'${escapeJS(bookName)}'
)"
>
⭐ Submit
</button>


<button
class="share-btn"
onclick="shareBook(
'${escapeJS(bookName)}',
'${escapeJS(pdfUrl)}'
)"
>
🔗 Share
</button>

</div>


<div class="review-message"></div>


<div class="review-summary">
⭐ Ratings loading...
</div>


<div class="comments">
Comments loading...
</div>

</div>

`;

bookList.appendChild(book);

const cover =
book.querySelector(".cover");

loadCover(
pdfUrl,
cover
);

loadReviews(
bookName,
book.querySelector(".review-summary"),
book.querySelector(".comments")
);

});

}
catch(error){

console.error(error);

bookList.innerHTML=`

<div class="message">

⚠️ Books load nahi ho pa rahe.

<br><br>

Error:
${escapeHTML(error.message)}

</div>

`;

}

}


/* =====================================
   RATING
===================================== */

function selectRating(star,rating){

const stars =
star.parentElement.querySelectorAll(".star");

stars.forEach((s,index)=>{

s.classList.toggle(
"selected",
index < rating
);

});

star.parentElement.dataset.rating =
rating;

}


/* =====================================
   SUBMIT REVIEW
===================================== */

async function submitReview(
button,
bookName
){

const box =
button.closest(".review-box");

const stars =
box.querySelector(".stars");

const rating =
stars.dataset.rating || "";

const comment =
box
.querySelector(".review-input")
.value
.trim();

const message =
box.querySelector(".review-message");


if(!rating && !comment){

message.textContent =
"⭐ Rating ya comment likhein.";

return;

}


button.disabled=true;

message.textContent =
"⏳ Submit ho raha hai...";


try{

await fetch(
GOOGLE_SCRIPT_URL,
{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

book:bookName,

rating:
rating
? Number(rating)
: "",

comment:
comment

})

}
);


box
.querySelector(".review-input")
.value="";

stars.dataset.rating="";

stars
.querySelectorAll(".star")
.forEach(
s=>s.classList.remove("selected")
);


message.textContent =
"✅ Review submit ho gaya!";


setTimeout(()=>{

loadReviews(
bookName,
box.querySelector(
".review-summary"
),
box.querySelector(
".comments"
)
);

},1500);

}
catch(error){

console.error(error);

message.textContent =
"⚠️ Review submit nahi hua.";

}

button.disabled=false;

}


/* =====================================
   LOAD REVIEWS FROM GOOGLE SHEET
===================================== */

async function loadReviews(
bookName,
summary,
commentsBox
){

try{

const response =
await fetch(
GOOGLE_SCRIPT_URL +
"?t=" +
Date.now()
);


if(!response.ok){

throw new Error(
"Google Script Error: " +
response.status
);

}


const rows =
await response.json();


if(!Array.isArray(rows)){

throw new Error(
"Invalid data"
);

}


/*
First row headings hai.

Sheet structure:

Book | Rating | Comment | Date
*/


const reviews =
rows
.slice(1)
.filter(row =>

String(
row[0] || ""
)
.trim() ===

String(
bookName || ""
)
.trim()

);


if(reviews.length===0){

summary.textContent =
"⭐ Abhi koi rating nahi.";

commentsBox.innerHTML =
"<div style='color:#777;font-size:13px;'>Abhi koi comment nahi.</div>";

return;

}


/* =====================================
   CALCULATE AVERAGE RATING
===================================== */

let total=0;

let count=0;


reviews.forEach(row=>{

const rating =
Number(row[1]);

if(
rating>=1 &&
rating<=5
){

total += rating;

count++;

}

});


const average =
count
? (total/count).toFixed(1)
: "0";


summary.textContent =
`⭐ ${average}/5 — ${count} rating${count===1?"":"s"}`;


/* =====================================
   SHOW COMMENTS
===================================== */

commentsBox.innerHTML="";


reviews
.filter(row => row[2])
.reverse()
.forEach(row=>{

const comment =
document.createElement("div");

comment.className="comment";


const rating =
Number(row[1]);


let stars="";


if(
rating>=1 &&
rating<=5
){

stars =
"★".repeat(rating) +
"☆".repeat(5-rating);

}


comment.innerHTML = `

${
stars
? `<div class="comment-stars">${stars}</div>`
: ""
}

<div class="comment-text">

${escapeHTML(
String(row[2])
)}

</div>

`;


commentsBox.appendChild(
comment
);

});

}
catch(error){

console.error(
"Review loading error:",
error
);


summary.textContent =
"⭐ Ratings load nahi ho rahe.";


commentsBox.innerHTML =
"<div style='color:#777;font-size:13px;'>Comments abhi load nahi ho rahe.</div>";

}

}


/* =====================================
   SHARE
===================================== */

async function shareBook(
bookName,
pdfUrl
){

const shareData={

title:
bookName +
" - Attari Books",

text:
"📚 " +
bookName +
" — Attari Books",

url:
pdfUrl

};


try{

if(
navigator.share
){

await navigator.share(
shareData
);

}
else{

await navigator.clipboard.writeText(
pdfUrl
);

alert(
"🔗 Book link copy ho gaya!"
);

}

}
catch(error){

console.log(
"Share cancelled"
);

}

}


/* =====================================
   LOAD COVER
===================================== */

async function loadCover(
pdfUrl,
cover
){

try{

const pdf =
await pdfjsLib
.getDocument(pdfUrl)
.promise;


const page =
await pdf.getPage(1);


const viewport =
page.getViewport({
scale:1.2
});


const canvas =
document.createElement("canvas");


const context =
canvas.getContext("2d");


canvas.width =
viewport.width;

canvas.height =
viewport.height;


cover.innerHTML="";

cover.appendChild(
canvas
);


await page.render({

canvasContext:
context,

viewport:
viewport

}).promise;

}
catch(error){

console.error(
"Cover error:",
error
);


cover.innerHTML=`

<div class="cover-loading">

📖
<br>

Cover unavailable

</div>

`;

}

}


/* =====================================
   OPEN READER
===================================== */

async function openReader(
pdfUrl,
title
){

const reader =
document.getElementById(
"reader"
);

const readerTitle =
document.getElementById(
"readerTitle"
);

const pdfPages =
document.getElementById(
"pdfPages"
);


reader.style.display="block";

document.body.style.overflow="hidden";

readerTitle.textContent=title;


pdfPages.innerHTML=`

<div style="
color:white;
padding:30px;
text-align:center;
">

📖 Book loading...

</div>

`;


try{

const pdf =
await pdfjsLib
.getDocument(pdfUrl)
.promise;


pdfPages.innerHTML="";


for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page =
await pdf.getPage(
pageNumber
);


const viewport =
page.getViewport({
scale:1.3
});


const canvas =
document.createElement(
"canvas"
);


const context =
canvas.getContext(
"2d"
);


canvas.width =
viewport.width;

canvas.height =
viewport.height;


pdfPages.appendChild(
canvas
);


await page.render({

canvasContext:
context,

viewport:
viewport

}).promise;

}

}
catch(error){

console.error(error);


pdfPages.innerHTML=`

<div style="
color:white;
text-align:center;
padding:40px;
">

⚠️ PDF open nahi ho pa rahi.

<br><br>

Please internet connection check karein.

</div>

`;

}

}


/* =====================================
   CLOSE READER
===================================== */

function closeReader(){

document.getElementById(
"reader"
).style.display="none";


document.body.style.overflow="";


document.getElementById(
"pdfPages"
).innerHTML="";

}


/* =====================================
   SEARCH
===================================== */

function searchBooks(){

const search =
document
.getElementById(
"searchBox"
)
.value
.toLowerCase();


const books =
document.querySelectorAll(
".book"
);


books.forEach(book=>{

const title =
book.innerText.toLowerCase();


book.style.display =
title.includes(search)
? ""
: "none";

});

}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(text){

const div =
document.createElement(
"div"
);

div.textContent=text;

return div.innerHTML;

}


function escapeJS(text){

return String(text)

.replace(/\\/g,"\\\\")

.replace(/'/g,"\\'")

.replace(/\n/g,"\\n")

.replace(/\r/g,"\\r");

}


/* =====================================
   START WEBSITE
===================================== */

loadBooks();

</script>

</body>

</html>
