<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f3ef;
  color:#222;
}

header{
  background:#24170f;
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

nav{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:bold;
}

.help-menu{
  position:relative;
  display:inline-block;
}

.help-button{
  background:none;
  border:none;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.help-options{
  display:none;
  position:absolute;
  right:0;
  top:30px;
  background:white;
  min-width:190px;
  border-radius:8px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  overflow:hidden;
  z-index:1000;
}

.help-options a{
  display:block;
  color:#24170f;
  text-decoration:none;
  padding:13px 15px;
  font-size:14px;
}

.help-options a:hover{
  background:#f5f3ef;
}

.help-menu:hover .help-options{
  display:block;
}

/* AUTH */

.auth-area{
  display:flex;
  align-items:center;
  gap:8px;
}

.auth-btn{
  background:white;
  color:#24170f;
  border:none;
  border-radius:7px;
  padding:9px 12px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.user-info{
  color:white;
  font-size:13px;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-btn{
  background:#e5ded5;
  color:#24170f;
}

/* AUTH MODAL */

#authModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:10000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  background:white;
  width:100%;
  max-width:400px;
  border-radius:12px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.auth-box h2{
  margin-bottom:8px;
  color:#24170f;
}

.auth-subtitle{
  color:#777;
  font-size:14px;
  margin-bottom:18px;
}

.auth-input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:14px;
}

.auth-submit{
  width:100%;
  padding:12px;
  background:#24170f;
  color:white;
  border:none;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.auth-switch{
  text-align:center;
  margin-top:14px;
  font-size:13px;
  color:#777;
}

.auth-switch button{
  border:none;
  background:none;
  color:#24170f;
  font-weight:bold;
  cursor:pointer;
}

.auth-message{
  margin-top:10px;
  font-size:13px;
  text-align:center;
}

.close-auth{
  float:right;
  border:none;
  background:none;
  font-size:20px;
  cursor:pointer;
  color:#777;
}

.hero{
  background:#3b271b;
  color:white;
  text-align:center;
  padding:75px 20px;
}

.hero h1{
  font-size:45px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;

}

.search{

.books{

  font-size:30px;

.book-grid{

}

.book{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.cover{
  height:280px;
  background:#ddd;
  border-radius:8px;
  margin-bottom:18px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover canvas{
  width:100%;
  height:100%;
  object-fit:contain;
}

.cover-loading{
  color:#777;
  text-align:center;
}

.book h3{
  margin-bottom:8px;
  word-break:break-word;

}

.author{

  margin-bottom:15px;
}

.buttons{
  display:flex;
  gap:10px;
}

.btn{

  padding:11px 7px;
  border-radius:7px;
  text-decoration:none;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  border:none;
  font-size:14px;
}

.read{
  background:#24170f;
  color:white;
}

.download{
  background:#e5ded5;
  color:#24170f;
}

/* REVIEW AREA */

.review-box{
  margin-top:18px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.login-required{
  background:#f7f5f2;
  border-radius:7px;
  padding:12px;
  font-size:13px;
  color:#777;
  margin-bottom:10px;
  text-align:center;
}

.login-required button{
  margin-top:8px;
  border:none;
  background:#24170f;
  color:white;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.stars{
  display:flex;
  gap:3px;
  margin-bottom:10px;
}

.star{
  font-size:25px;
  cursor:pointer;
  color:#ccc;
  user-select:none;
}

.star.selected{
  color:#f5a623;
}

.review-input{
  width:100%;
  min-height:70px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:7px;
  resize:vertical;
  font-family:Arial,sans-serif;
}

.review-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.review-submit,
.share-btn{
  border:none;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

.review-submit{
  background:#24170f;
  color:white;
}

.share-btn{
  background:#e5ded5;
  color:#24170f;
}

.review-message{
  font-size:13px;
  color:#777;
  margin-top:8px;
}

.review-summary{
  margin-top:12px;
  font-size:14px;
  font-weight:bold;
}

.comments{
  margin-top:12px;
  max-height:220px;
  overflow-y:auto;
}

.comment{
  background:#f7f5f2;
  border-radius:7px;
  padding:9px;
  margin-top:7px;
  font-size:13px;
}

.comment-stars{
  color:#f5a623;
  margin-bottom:4px;
}

.comment-text{
  word-break:break-word;
}

.message{
  text-align:center;
  padding:30px;
  color:#777;
  grid-column:1/-1;
}

/* READER */

#reader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:9999;
  overflow:auto;
}

.reader-top{
  position:sticky;
  top:0;
  background:#24170f;
  color:white;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:10;
}

.reader-title{
  font-weight:bold;
  max-width:75%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.close-reader{
  background:white;
  color:#24170f;
  border:none;
  border-radius:6px;
  padding:8px 12px;
  font-weight:bold;
  cursor:pointer;
}

#pdfPages{
  padding:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

#pdfPages canvas{
  max-width:100%;
  height:auto;
  background:white;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
}

footer{
  background:#24170f;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:600px){

  .hero h1{

    justify-content:center;
    gap:14px;
  }

  nav a,
  .help-button{
    font-size:13px;
  }

  .cover{
    height:300px;
  }

  .auth-area{
    width:100%;
    justify-content:center;
  }

}

</style>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://kihhuilyeosvpozduwcs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-XN0lujfPGCeIzusrlUfkQ_-lFKXw";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================
   GOOGLE APPS SCRIPT URL
===================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


/* =====================================
   GITHUB SETTINGS
===================================== */

const GITHUB_OWNER =
"malmd9194-ai";

const GITHUB_REPO =
"Attari_Books";

const GITHUB_BRANCH =
"main";


/* =====================================
   PDF.JS
===================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================
   AUTH STATE
===================================== */

let currentUser = null;

let authMode = "login";


/* =====================================
   CHECK LOGIN
===================================== */

async function checkAuth(){

const {
  data,
  error
} = await supabaseClient.auth.getSession();

if(error){

console.error(
"Session error:",
error
);

return;

}

currentUser =
data.session
? data.session.user
: null;

updateAuthUI();

}


supabaseClient.auth.onAuthStateChange(
function(event,session){

currentUser =
session
? session.user
: null;

updateAuthUI();

}
);


/* =====================================
   UPDATE AUTH UI
===================================== */

function updateAuthUI(){

const authArea =
document.getElementById(
"authArea"
);

if(!authArea) return;


if(currentUser){

const email =
currentUser.email || "User";

authArea.innerHTML = `

<span class="user-info">
👤 ${escapeHTML(email)}
</span>

<button
class="auth-btn logout-btn"
onclick="logout()"
>
🚪 Logout
</button>

`;

}
else{

authArea.innerHTML = `

<button
class="auth-btn"
onclick="openAuth('login')"
>
🔐 Login
</button>

<button
class="auth-btn"
onclick="openAuth('signup')"
>
📝 Sign Up
</button>

`;

}


/* Update review areas */

document
.querySelectorAll(".review-box")
.forEach(box=>{

updateReviewBox(box);

});

}


/* =====================================
   UPDATE REVIEW BOX
===================================== */

function updateReviewBox(box){

if(!box) return;


const loginRequired =
box.querySelector(
".login-required"
);

const stars =
box.querySelector(".stars");

const input =
box.querySelector(".review-input");

const submit =
box.querySelector(".review-submit");


if(currentUser){

if(loginRequired){
loginRequired.style.display="none";
}

if(stars){
stars.style.display="flex";
}

if(input){
input.style.display="block";
}

if(submit){
submit.style.display="inline-block";
}

}
else{

if(loginRequired){
loginRequired.style.display="block";
}

if(stars){
stars.style.display="none";
}

if(input){
input.style.display="none";
}

if(submit){
submit.style.display="none";
}

}

}


/* =====================================
   OPEN AUTH
===================================== */

function openAuth(mode){

authMode =
mode || "login";

const modal =
document.getElementById(
"authModal"
);

modal.style.display="flex";

updateAuthForm();

document
.getElementById("authEmail")
.focus();

}


/* =====================================
   CLOSE AUTH
===================================== */

function closeAuth(){

document
.getElementById("authModal")
.style.display="none";

document
.getElementById("authMessage")
.textContent="";

}


/* =====================================
   SWITCH AUTH
===================================== */

function switchAuth(mode){

authMode =
mode;

document
.getElementById("authMessage")
.textContent="";

updateAuthForm();

}


/* =====================================
   AUTH FORM
===================================== */

function updateAuthForm(){

const title =
document.getElementById(
"authTitle"
);

const subtitle =
document.getElementById(
"authSubtitle"
);

const submit =
document.getElementById(
"authSubmit"
);

const switchBox =
document.getElementById(
"authSwitch"
);

if(authMode==="signup"){

title.textContent =
"📝 Sign Up";

subtitle.textContent =
"Account banayein aur rating/comment karein.";

submit.textContent =
"Sign Up";

switchBox.innerHTML = `
Already account hai?
<button onclick="switchAuth('login')">
Login
</button>
`;

}
else{

title.textContent =
"🔐 Login";

subtitle.textContent =
"Login karke rating aur comment karein.";

submit.textContent =
"Login";

switchBox.innerHTML = `
Account nahi hai?
<button onclick="switchAuth('signup')">
Sign Up
</button>
`;

}

}


/* =====================================
   HANDLE AUTH
===================================== */

async function handleAuth(){

const email =
document
.getElementById("authEmail")
.value
.trim();

const password =
document
.getElementById("authPassword")
.value;

const message =
document
.getElementById("authMessage");

const button =
document
.getElementById("authSubmit");


if(!email || !password){

message.textContent =
"⚠️ Email aur password dono likhein.";

return;

}


if(password.length < 6){

message.textContent =
"⚠️ Password kam az kam 6 characters ka ho.";

return;

}


button.disabled=true;

message.textContent =
"⏳ Please wait...";


try{

if(authMode==="signup"){

const {
  data,
  error
} =
await supabaseClient.auth.signUp({

email:email,

password:password

});


if(error){
throw error;
}


/*
Supabase mein Confirm email ON hai.
Isliye user ko email verify karna hoga.
*/

if(data.session){

message.textContent =
"✅ Account ban gaya aur login ho gaya.";

setTimeout(
closeAuth,
800
);

}
else{

message.textContent =
"✅ Sign Up ho gaya! Apni email check karke account verify karein.";

}

}
else{

const {
  data,
  error
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){
throw error;
}


if(data.session){

message.textContent =
"✅ Login successful!";

setTimeout(
closeAuth,
500
);

}

}

}
catch(error){

console.error(
"Auth error:",
error
);

message.textContent =
"⚠️ " +
(error.message ||
"Login/Sign Up nahi hua.");

}

button.disabled=false;

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

const {
  error
} =
await supabaseClient.auth.signOut();

if(error){

alert(
"Logout nahi hua."
);

return;

}

alert(
"✅ Logout ho gaya."
);

}


/* =====================================
   HELP
===================================== */

function toggleHelp(event){

event.stopPropagation();

const menu =
document.getElementById("helpOptions");

menu.style.display =
menu.style.display === "block"
? "none"
: "block";

}


document.addEventListener(
"click",
function(){

document.getElementById(
"helpOptions"
).style.display="none";

}
);


/* =====================================
   LOAD BOOKS
===================================== */

async function loadBooks(){

const bookList =
document.getElementById("bookList");

try{

const apiUrl =
`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

const response =
await fetch(apiUrl);

if(!response.ok){

throw new Error(
"GitHub API Error: " + response.status
);

}

const files =
await response.json();

const pdfFiles =
files.filter(file =>
file.type === "file" &&
file.name.toLowerCase().endsWith(".pdf")
);

bookList.innerHTML="";

if(pdfFiles.length===0){

bookList.innerHTML=`

<div class="message">

📚 No PDF books found.

<br><br>

GitHub repository me PDF upload karein.

</div>

`;

return;

}

pdfFiles.forEach(file=>{

const bookName =
file.name
.replace(/\.pdf$/i,"")
.replace(/[_-]/g," ");

const encodedFileName =
encodeURIComponent(file.name);

const pdfUrl =
`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodedFileName}`;

const book =
document.createElement("div");

book.className="book";

book.innerHTML=`

<div class="cover">

<div class="cover-loading">

📖
<br>
Loading cover...

</div>

</div>

<h3>${escapeHTML(bookName)}</h3>

<p class="author">
Attari Books
</p>

<div class="buttons">

<button
class="btn read"
onclick="openReader(
'${escapeJS(pdfUrl)}',
'${escapeJS(bookName)}'
)"
>
📖 Read
</button>

<a
href="${escapeHTML(pdfUrl)}"
class="btn download"
download
>
⬇ Download
</a>

</div>


<div class="review-box">


<div
class="login-required"
>

🔐 Rating ya comment karne ke liye pehle Login karein.

<br>

<button
onclick="openAuth('login')"
>
🔐 Login
</button>

<button
onclick="openAuth('signup')"
>
📝 Sign Up
</button>

</div>


<div class="stars">

<span
class="star"
onclick="selectRating(this,1)"
>★</span>

<span
class="star"
onclick="selectRating(this,2)"
>★</span>

<span
class="star"
onclick="selectRating(this,3)"
>★</span>

<span
class="star"
onclick="selectRating(this,4)"
>★</span>

<span
class="star"
onclick="selectRating(this,5)"
>★</span>

</div>


<textarea
class="review-input"
placeholder="Apna comment likhein..."
></textarea>


<div class="review-actions">

<button
class="review-submit"
onclick="submitReview(
this,
'${escapeJS(bookName)}'
)"
>
⭐ Submit
</button>


<button
class="share-btn"
onclick="shareBook(
'${escapeJS(bookName)}',
'${escapeJS(pdfUrl)}'
)"
>
🔗 Share
</button>

</div>


<div class="review-message"></div>


<div class="review-summary">
⭐ Ratings loading...
</div>


<div class="comments">
Comments loading...
</div>

</div>

`;

bookList.appendChild(book);

const cover =
book.querySelector(".cover");

loadCover(
pdfUrl,
cover
);

function selectRating(star,rating){

if(!currentUser){

openAuth("login");

return;

}


const stars =
star.parentElement.querySelectorAll(".star");

stars.forEach((s,index)=>{

s.classList.toggle(
"selected",
index < rating
);

});

star.parentElement.dataset.rating =
rating;

}
