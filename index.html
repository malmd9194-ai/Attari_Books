<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attari Books</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #222;
    }

    header {
      background: #24170f;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      background: #3b271b;
      color: white;
      text-align: center;
      padding: 75px 20px;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search {
      width: 90%;
      max-width: 550px;
      padding: 15px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
    }

    .books {
      padding: 50px 6%;
    }

    .books h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 30px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .book {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .cover {
      height: 250px;
      background: #ddd;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      margin-bottom: 18px;
    }

    .book h3 {
      margin-bottom: 8px;
      word-break: break-word;
    }

    .author {
      color: #777;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px 7px;
      border-radius: 7px;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .read {
      background: #24170f;
      color: white;
    }

    .download {
      background: #e5ded5;
      color: #24170f;
    }

    .message {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    footer {
      background: #24170f;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 38px;
      }

      header {
        padding: 15px 4%;
      }

      .logo {
        font-size: 21px;
      }

      nav a {
        margin-left: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">📚 Attari Books</div>

  <nav>
    <a href="#">Home</a>
    <a href="#books">Books</a>
  </nav>
</header>

<section class="hero">
  <h1>Attari Books</h1>
  <p>Your Digital Library</p>

  <input
    class="search"
    type="text"
    id="searchBox"
    placeholder="Search books..."
    onkeyup="searchBooks()"
  >
</section>

<section class="books" id="books">

  <h2>Latest Books</h2>

  <div class="book-grid" id="bookList">
    <div class="message">📚 Loading books...</div>
  </div>

</section>

<footer>
  © 2026 Attari Books — All Rights Reserved
</footer>


<script>

  /* ==============================
     ATTARI BOOKS SETTINGS
     ============================== */

  const GITHUB_OWNER = "malmd9194-ai";
  const GITHUB_REPO = "Attari_Books";
  const GITHUB_BRANCH = "main";


  /* ==============================
     LOAD ALL PDF BOOKS
     ============================== */

  async function loadBooks() {

    const bookList = document.getElementById("bookList");

    try {

      const apiUrl =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error("GitHub repository could not be loaded.");
      }

      const files = await response.json();

      const pdfFiles = files.filter(file =>
        file.type === "file" &&
        file.name.toLowerCase().endsWith(".pdf")
      );

      bookList.innerHTML = "";

      if (pdfFiles.length === 0) {

        bookList.innerHTML =
          `<div class="message">
             📚 No books uploaded yet.
           </div>`;

        return;
      }


      pdfFiles.forEach(file => {

        const bookName = file.name
          .replace(/\.pdf$/i, "")
          .replace(/[_-]/g, " ");


        const encodedFileName =
          encodeURIComponent(file.name);


        const readUrl =
          `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/raw/refs/heads/${GITHUB_BRANCH}/${encodedFileName}`;


        const book = document.createElement("div");

        book.className = "book";

        book.innerHTML = `

          <div class="cover">
            📖
          </div>

          <h3>${escapeHTML(bookName)}</h3>

          <p class="author">
            Attari Books
          </p>

          <div class="buttons">

            <a
              href="${readUrl}"
              target="_blank"
              class="btn read"
            >
              📖 Read
            </a>

            <a
              href="${readUrl}"
              download
              class="btn download"
            >
              ⬇ Download
            </a>

          </div>
        `;

        bookList.appendChild(book);

      });

    } catch (error) {

      console.error(error);

      bookList.innerHTML =
        `<div class="message">
           ⚠️ Books load nahi ho pa rahe.
           <br><br>
           Thodi der baad page refresh karein.
         </div>`;
    }
  }


  /* ==============================
     SEARCH BOOKS
     ============================== */

  function searchBooks() {

    const search =
      document
        .getElementById("searchBox")
        .value
        .toLowerCase();

    const books =
      document.querySelectorAll(".book");


    books.forEach(book => {

      const title =
        book.innerText.toLowerCase();

      if (title.includes(search)) {
        book.style.display = "";
      } else {
        book.style.display = "none";
      }

    });

  }


  /* ==============================
     SECURITY
     ============================== */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  /* ==============================
     START
     ============================== */

  loadBooks();

</script>

</body>
</html>
