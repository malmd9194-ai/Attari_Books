<script>

/* =====================================
   GOOGLE APPS SCRIPT URL
===================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyMcUDNnTOpmwHf2xrF82P9260595M6rBXcPHvbR0Fu9ZN3BnyNGCApI51w1M5XO4F/exec";


/* =====================================
   GITHUB SETTINGS
===================================== */

const GITHUB_OWNER =
"malmd9194-ai";

const GITHUB_REPO =
"Attari_Books";

const GITHUB_BRANCH =
"main";


/* =====================================
   PDF.JS
===================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================
   HELP MENU
===================================== */

function toggleHelp(event){

  event.stopPropagation();

  const menu =
  document.getElementById("helpOptions");

  menu.style.display =
  menu.style.display === "block"
  ? "none"
  : "block";

}

document.addEventListener(
  "click",
  function(){

    const menu =
    document.getElementById("helpOptions");

    if(menu){
      menu.style.display="none";
    }

  }
);


/* =====================================
   LOAD BOOKS
===================================== */

async function loadBooks(){

  const bookList =
  document.getElementById("bookList");

  try{

    const apiUrl =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

    const response =
    await fetch(apiUrl);

    if(!response.ok){

      throw new Error(
        "GitHub API Error: " +
        response.status
      );

    }

    const files =
    await response.json();

    const pdfFiles =
    files.filter(
      file =>
      file.type === "file" &&
      file.name
      .toLowerCase()
      .endsWith(".pdf")
    );

    bookList.innerHTML="";


    if(pdfFiles.length===0){

      bookList.innerHTML=`

      <div class="message">

        📚 No PDF books found.

        <br><br>

        GitHub repository me PDF upload karein.

      </div>

      `;

      return;

    }


    pdfFiles.forEach(file => {

      const bookName =
      file.name
      .replace(/\.pdf$/i,"")
      .replace(/[_-]/g," ");


      const encodedFileName =
      encodeURIComponent(file.name);


      const pdfUrl =
      `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodedFileName}`;


      const book =
      document.createElement("div");

      book.className =
      "book";


      book.innerHTML=`

      <!-- ONLY BOOK NAME -->

      <button
        class="book-title"
        onclick="toggleBook(this)"
      >

        <span>
          📖 ${escapeHTML(bookName)}
        </span>

        <span class="book-arrow">
          ▼
        </span>

      </button>


      <!-- BOOK DETAILS -->

      <div class="book-details">


        <!-- READ DOWNLOAD SHARE -->

        <div class="buttons">


          <button
            class="btn read"
            onclick="openReader(
              '${escapeJS(pdfUrl)}',
              '${escapeJS(bookName)}'
            )"
          >
            📖 Read
          </button>


          <a
            href="${pdfUrl}"
            class="btn download"
            download
          >
            ⬇ Download
          </a>


          <button
            class="btn share-btn"
            onclick="shareBook(
              '${escapeJS(bookName)}',
              '${escapeJS(pdfUrl)}'
            )"
          >
            🔗 Share
          </button>


        </div>


        <!-- REVIEW -->

        <div class="review-box">


          <div class="rating-title">
            ⭐ Rating
          </div>


          <div class="stars">

            <span
              class="star"
              onclick="selectRating(this,1)"
            >
              ★
            </span>

            <span
              class="star"
              onclick="selectRating(this,2)"
            >
              ★
            </span>

            <span
              class="star"
              onclick="selectRating(this,3)"
            >
              ★
            </span>

            <span
              class="star"
              onclick="selectRating(this,4)"
            >
              ★
            </span>

            <span
              class="star"
              onclick="selectRating(this,5)"
            >
              ★
            </span>

          </div>


          <textarea
            class="review-input"
            placeholder="Apna comment likhein..."
          ></textarea>


          <div class="review-actions">

            <button
              class="review-submit"
              onclick="submitReview(
                this,
                '${escapeJS(bookName)}'
              )"
            >
              Submit
            </button>

          </div>


          <div class="review-message"></div>


          <div class="review-summary">
            ⭐ Ratings loading...
          </div>


          <div class="comments">
            Comments loading...
          </div>


        </div>

      </div>

      `;


      bookList.appendChild(book);


      /*
         Reviews automatically load.
      */

      loadReviews(
        bookName,
        book.querySelector(
          ".review-summary"
        ),
        book.querySelector(
          ".comments"
        )
      );

    });

  }
  catch(error){

    console.error(error);

    bookList.innerHTML=`

    <div class="message">

      ⚠️ Books load nahi ho pa rahe.

      <br><br>

      Error:
      ${escapeHTML(error.message)}

    </div>

    `;

  }

}


/* =====================================
   OPEN / CLOSE BOOK DETAILS
===================================== */

function toggleBook(button){

  const book =
  button.closest(".book");

  book.classList.toggle("open");

}


/* =====================================
   SELECT RATING
===================================== */

function selectRating(
  star,
  rating
){

  const stars =
  star.parentElement
  .querySelectorAll(".star");


  stars.forEach(
    (s,index) => {

      s.classList.toggle(
        "selected",
        index < rating
      );

    }
  );


  star.parentElement.dataset.rating =
  rating;

}


/* =====================================
   SUBMIT REVIEW
===================================== */

async function submitReview(
  button,
  bookName
){

  const box =
  button.closest(".review-box");


  const stars =
  box.querySelector(".stars");


  const rating =
  stars.dataset.rating || "";


  const comment =
  box
  .querySelector(".review-input")
  .value
  .trim();


  const message =
  box.querySelector(
    ".review-message"
  );


  if(!rating && !comment){

    message.textContent =
    "⭐ Rating ya comment likhein.";

    return;

  }


  button.disabled=true;


  message.textContent =
  "⏳ Submit ho raha hai...";


  try{

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:JSON.stringify({

          book:bookName,

          rating:
          rating
          ? Number(rating)
          : "",

          comment:comment

        })

      }
    );


    box
    .querySelector(
      ".review-input"
    )
    .value="";


    stars.dataset.rating="";


    stars
    .querySelectorAll(".star")
    .forEach(
      s =>
      s.classList.remove(
        "selected"
      )
    );


    message.textContent =
    "✅ Review submit ho gaya!";


    /*
       Sheet ko update hone ke liye
       thoda time dete hain.
    */

    setTimeout(
      function(){

        loadReviews(
          bookName,
          box.querySelector(
            ".review-summary"
          ),
          box.querySelector(
            ".comments"
          )
        );

      },
      2000
    );

  }
  catch(error){

    console.error(error);

    message.textContent =
    "⚠️ Review submit nahi hua.";

  }


  button.disabled=false;

}


/* =====================================
   LOAD REVIEWS FROM GOOGLE SHEET
===================================== */

async function loadReviews(
  bookName,
  summary,
  commentsBox
){

  try{

    /*
       Timestamp cache ko avoid karta hai.
    */

    const response =
    await fetch(
      GOOGLE_SCRIPT_URL +
      "?t=" +
      Date.now()
    );


    if(!response.ok){

      throw new Error(
        "Google Script Error: " +
        response.status
      );

    }


    const rows =
    await response.json();


    if(!Array.isArray(rows)){

      throw new Error(
        "Invalid data"
      );

    }


    console.log(
      "Google Sheet data:",
      rows
    );


    /*
       Sheet:

       Book | Rating | Comment | Date
    */

    const reviews =
    rows.filter(
      (row,index) => {

        /*
           Heading row skip.
        */

        if(index === 0){
          return false;
        }


        if(
          !row ||
          row.length < 3
        ){
          return false;
        }


        return (
          String(
            row[0] || ""
          ).trim()
          ===
          String(
            bookName || ""
          ).trim()
        );

      }
    );


    /*
       No reviews.
    */

    if(
      reviews.length===0
    ){

      summary.textContent =
      "⭐ Abhi koi rating nahi.";


      commentsBox.innerHTML =
      `
      <div
        style="
          color:#777;
          font-size:13px;
        "
      >
        Abhi koi comment nahi.
      </div>
      `;


      return;

    }


    /* ===============================
       AVERAGE RATING
    =============================== */

    let total=0;

    let count=0;


    reviews.forEach(
      row => {

        const rating =
        Number(row[1]);


        if(
          rating >= 1 &&
          rating <= 5
        ){

          total += rating;

          count++;

        }

      }
    );


    const average =
    count
    ? (total / count).toFixed(1)
    : "0";


    summary.textContent =
    `⭐ ${average}/5 — ${count} rating${count===1?"":"s"}`;


    /* ===============================
       COMMENTS
    =============================== */

    commentsBox.innerHTML="";


    const commentReviews =
    reviews.filter(
      row =>
      String(
        row[2] || ""
      ).trim() !== ""
    );


    if(
      commentReviews.length===0
    ){

      commentsBox.innerHTML =
      `
      <div
        style="
          color:#777;
          font-size:13px;
        "
      >
        Abhi koi comment nahi.
      </div>
      `;

      return;

    }


    /*
       Latest comment first.
    */

    commentReviews
    .reverse()
    .forEach(
      row => {

        const comment =
        document.createElement(
          "div"
        );


        comment.className =
        "comment";


        const rating =
        Number(row[1]);


        let stars="";


        if(
          rating >= 1 &&
          rating <= 5
        ){

          stars =
          "★".repeat(rating) +
          "☆".repeat(
            5-rating
          );

        }


        comment.innerHTML =
        `

        ${
          stars
          ?
          `
          <div class="comment-stars">
            ${stars}
          </div>
          `
          :
          ""
        }


        <div class="comment-text">

          ${escapeHTML(
            String(row[2])
          )}

        </div>

        `;


        commentsBox.appendChild(
          comment
        );

      }
    );

  }
  catch(error){

    console.error(
      "Review loading error:",
      error
    );


    summary.textContent =
    "⭐ Ratings load nahi ho rahe.";


    commentsBox.innerHTML =
    `
    <div
      style="
        color:#777;
        font-size:13px;
      "
    >
      Comments load nahi ho rahe.
    </div>
    `;

  }

}


/* =====================================
   SHARE
===================================== */

async function shareBook(
  bookName,
  pdfUrl
){

  const shareData={

    title:
    bookName +
    " - Attari Books",

    text:
    "📚 " +
    bookName +
    " — Attari Books",

    url:
    pdfUrl

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }
    else{

      await navigator.clipboard
      .writeText(
        pdfUrl
      );
